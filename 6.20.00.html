<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surfer2 · 更懂浏览更懂你</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background-color 0.2s;
            margin: 0;
        }

        /* ========== 高对比度模式 ========== */
        body.high-contrast { background: #000000 !important; }
        body.high-contrast .surfer-container,
        body.high-contrast .toolbar,
        body.high-contrast .internal-page,
        body.high-contrast .settings-group,
        body.high-contrast .calc-gui,
        body.high-contrast .calc-display,
        body.high-contrast .game-cell,
        body.high-contrast .game-board,
        body.high-contrast .translate-box,
        body.high-contrast .note-textarea,
        body.high-contrast .note-preview,
        body.high-contrast .pin-add,
        body.high-contrast .pin-item,
        body.high-contrast .page-card,
        body.high-contrast .board-tab,
        body.high-contrast .plugin-tab,
        body.high-contrast .map-container,
        body.high-contrast .transfer-message,
        body.high-contrast .tab-bar,
        body.high-contrast .tab-btn,
        body.high-contrast .session-card {
            background: #000000 !important;
            border-color: #ffffff !important;
            color: #ffffff !important;
        }
        body.high-contrast button,
        body.high-contrast .calc-gui-btn,
        body.high-contrast .go-btn,
        body.high-contrast .report-btn {
            background: #333333 !important;
            color: #ffffff !important;
            border: 1px solid #ffffff !important;
        }
        body.high-contrast a { color: #ffff00 !important; }

        /* ========== 浅色模式 ========== */
        body.light-mode { background: #e2e8f0; }
        body.light-mode .surfer-container,
        body.light-mode .internal-page,
        body.light-mode .translate-box,
        body.light-mode .pin-add,
        body.light-mode .pin-item,
        body.light-mode .page-card,
        body.light-mode .plugin-tab,
        body.light-mode .transfer-message,
        body.light-mode .tab-bar,
        body.light-mode .session-card {
            background: #ffffff;
            border-color: #cbd5e1;
        }
        body.light-mode .toolbar,
        body.light-mode .nav-buttons,
        body.light-mode .url-bar {
            background: #f1f5f9;
        }
        body.light-mode .nav-btn,
        body.light-mode .calc-gui-btn {
            background: #cbd5e1;
            color: #1e293b;
        }
        body.light-mode .game-board {
            background: #cbd5e1;
        }
        body.light-mode .game-cell {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
        }
        body.light-mode .note-textarea,
        body.light-mode .note-preview,
        body.light-mode .translate-textarea,
        body.light-mode .calc-display {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        body.light-mode .plugin-tab.active {
            background: #3b82f6;
            color: white;
        }

        /* ========== 用户菜单 ========== */
        .user-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background: #1e293b;
            border-radius: 20px;
            padding: 12px;
            min-width: 200px;
            z-index: 200;
            display: none;
            border: 1px solid #475569;
        }
        .user-menu.show { display: block; }
        .user-menu-item {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 12px;
            color: #e2e8f0;
        }
        .user-menu-item:hover { background: #2d3e5f; }
        body.light-mode .user-menu {
            background: #ffffff;
            border-color: #cbd5e1;
        }
        body.light-mode .user-menu-item {
            color: #1e293b;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .acrylic-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.35s ease;
            opacity: 0;
            background: rgba(14, 20, 39, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
        }
        body.acrylic-active .acrylic-layer { opacity: 1; }

        .surfer-container {
            width: 100%;
            max-width: 1400px;
            height: calc(100vh - 32px);
            background: #0e1427;
            border-radius: 32px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2d3e5f;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        body.light-mode .surfer-container {
            background: #ffffff;
            border-color: #cbd5e1;
        }
        body.acrylic-active .surfer-container {
            background: rgba(14, 20, 39, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
        }

        /* ========== 标签页 ========== */
        .tab-bar {
            display: flex;
            background: #111927cc;
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-bottom: 1px solid #2a3a55;
            gap: 4px;
            flex-wrap: nowrap;
            overflow-x: auto;
            flex-shrink: 0;
            align-items: center;
        }
        body.light-mode .tab-bar {
            background: #f1f5f9;
            border-bottom-color: #e2e8f0;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            padding: 4px 12px;
            border-radius: 16px;
            color: #87b9ff;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        body.light-mode .tab-btn {
            background: #e2e8f0;
            color: #1e293b;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }
        .tab-btn .tab-close {
            margin-left: 4px;
            font-size: 0.6rem;
            opacity: 0.6;
            cursor: pointer;
        }
        .tab-btn .tab-close:hover { opacity: 1; }
        .tab-add-btn {
            background: transparent;
            border: 1px solid #3b82f6;
            color: #3b82f6;
            border-radius: 16px;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        body.light-mode .tab-add-btn {
            border-color: #1f6392;
            color: #1f6392;
        }

        .toolbar {
            background: #111927cc;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-bottom: 1px solid #2a3a55;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        body.light-mode .toolbar {
            background: #f1f5f9;
            border-bottom-color: #e2e8f0;
        }

        .nav-buttons {
            display: flex;
            gap: 6px;
            background: #0b101e99;
            padding: 4px 10px;
            border-radius: 48px;
        }
        body.light-mode .nav-buttons { background: #e2e8f0; }

        .nav-btn {
            background: #1e2a3e;
            border: none;
            color: #b4d0ff;
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            cursor: pointer;
        }
        body.light-mode .nav-btn {
            background: #cbd5e1;
            color: #1e293b;
        }

        .url-bar {
            flex: 1;
            display: flex;
            gap: 6px;
            background: #0b101e99;
            padding: 4px 12px;
            border-radius: 60px;
            align-items: center;
            min-width: 150px;
        }
        body.light-mode .url-bar { background: #e2e8f0; }

        .url-input {
            flex: 1;
            background: #010a1a;
            border: 1px solid #2c5270;
            padding: 8px 14px;
            border-radius: 48px;
            color: #c0e0ff;
            font-size: 0.85rem;
            outline: none;
            min-width: 100px;
            transition: color 0.2s;
        }
        body.light-mode .url-input {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .url-input.homepage-focused {
            color: #4a627a;
            font-style: italic;
        }

        .go-btn {
            background: #1f6392;
            border: none;
            padding: 5px 14px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .status {
            font-size: 0.65rem;
            background: #030a17aa;
            padding: 3px 10px;
            border-radius: 20px;
            color: #87b9ff;
        }
        body.light-mode .status {
            background: #e2e8f0;
            color: #475569;
        }

        .boss-btn, .pin-btn, .hide-window-btn, .user-btn {
            background: #4a5568;
            border: none;
            padding: 4px 14px;
            border-radius: 32px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .boss-btn { background: #9e4a2c; }
        .pin-btn { background: #8b5cf6; }
        .user-btn { background: #22c55e; }

        .wave-area {
            flex: 1;
            position: relative;
            overflow: auto;
            min-height: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: block;
        }

        .internal-page {
            width: 100%;
            min-height: 100%;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            overflow-y: auto;
        }
        body.light-mode .internal-page {
            background: #f8fafc;
            color: #1e293b;
        }

        .settings-group {
            margin-bottom: 20px;
            padding: 12px;
            background: #1e293b;
            border-radius: 16px;
        }
        body.light-mode .settings-group {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        /* ========== 防御拦截界面 ========== */
        .blocked-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            flex-direction: column;
            gap: 16px;
            color: #ff6b6b;
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }
        .blocked-overlay .blocked-url { color: #87b9ff; font-size: 0.85rem; word-break: break-all; max-width: 600px; }
        .blocked-overlay .blocked-reason { color: #fbbf24; font-size: 0.85rem; max-width: 500px; }
        .blocked-overlay .blocked-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .blocked-overlay button {
            background: #3b82f6;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .blocked-overlay .blocked-trust-btn { background: #22c55e; }
        .blocked-overlay .blocked-permanent-btn { background: #8b5cf6; }
        .blocked-overlay .blocked-back-btn { background: #64748b; }
        .blocked-overlay .blocked-search-box { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .blocked-overlay .blocked-search-box input { padding: 8px 16px; border-radius: 40px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; width: 260px; }
        .blocked-overlay .blocked-search-box button { background: #3b82f6; border: none; padding: 8px 16px; border-radius: 40px; color: white; cursor: pointer; }
        .blocked-overlay .blocked-settings { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .blocked-overlay .blocked-settings label { color: #e2e8f0; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
        .blocked-overlay .blocked-account-btn { background: #22c55e; border: none; padding: 6px 16px; border-radius: 40px; color: white; cursor: pointer; font-size: 0.8rem; }

        /* ========== 首页 ========== */
        .homepage-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 40px 20px;
        }
        .homepage-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .search-box {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .search-input {
            width: 400px;
            max-width: 70vw;
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
        }
        body.light-mode .search-input {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .engine-select {
            padding: 12px 20px;
            border-radius: 60px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            cursor: pointer;
        }
        body.light-mode .engine-select {
            background: #ffffff;
            color: #1e293b;
        }
        .pure-search {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #87b9ff;
            font-size: 0.85rem;
        }
        body.light-mode .pure-search { color: #4a627a; }

        /* ========== 会话卡片 ========== */
        .session-card {
            background: #1e293b;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #2d3e5f;
        }
        body.light-mode .session-card {
            border-color: #cbd5e1;
        }
        .session-card:hover { transform: translateY(-4px); background: #2d3e5f; }
        body.light-mode .session-card:hover { background: #e2e8f0; }
        .session-card .session-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .session-card .session-title { font-size: 1.2rem; font-weight: bold; }
        .session-card .session-desc { font-size: 0.8rem; color: #87b9ff; margin-top: 4px; }
        body.light-mode .session-card .session-desc { color: #4a627a; }

        .session-join-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-top: 16px;
        }
        .session-join-form select, .session-join-form input {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
        }
        body.light-mode .session-join-form select,
        body.light-mode .session-join-form input {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .session-join-form button {
            background: #3b82f6;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* ========== 其他组件 ========== */
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .page-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }
        body.light-mode .page-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
        }
        .page-card:hover { transform: translateY(-3px); background: #2d3e5f; }

        .pin-container { display: flex; flex-direction: column; gap: 20px; }
        .pin-add {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: #1e293b;
            padding: 16px;
            border-radius: 24px;
        }
        body.light-mode .pin-add { background: #ffffff; border: 1px solid #e2e8f0; }
        .pin-add input { flex: 1; padding: 10px 16px; border-radius: 40px; background: #0f172a; border: 1px solid #475569; color: inherit; }
        body.light-mode .pin-add input { background: #ffffff; border-color: #cbd5e1; }
        .pin-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .pin-item {
            background: #1e293b;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        body.light-mode .pin-item { background: #ffffff; border: 1px solid #e2e8f0; }
        .pin-item .pin-delete { background: #ef4444; border: none; padding: 4px 12px; border-radius: 20px; color: white; cursor: pointer; }

        .game-board {
            display: grid;
            gap: 2px;
            justify-content: center;
            margin: 20px auto;
            background: #2d3748;
            padding: 10px;
            border-radius: 16px;
            grid-template-columns: repeat(3, 80px);
        }
        .game-cell {
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            min-width: 30px;
        }

        .translate-container { max-width: 900px; margin: 0 auto; }
        .translate-box { background: #1e293b; border-radius: 24px; padding: 20px; }
        body.light-mode .translate-box { background: #ffffff; border: 1px solid #e2e8f0; }
        .translate-textarea { width: 100%; height: 150px; padding: 12px; border-radius: 16px; background: #0f172a; border: 1px solid #475569; resize: vertical; }

        .calc-gui { background: #1e293b; border-radius: 24px; padding: 20px; margin-top: 16px; }
        body.light-mode .calc-gui { background: #ffffff; border: 1px solid #e2e8f0; }
        .calc-display { background: #0f172a; border-radius: 20px; padding: 20px; margin-bottom: 20px; font-family: monospace; font-size: 1.8rem; text-align: right; min-height: 80px; }
        .calc-gui-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .calc-gui-btn { flex: 1; padding: 16px 8px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; background: #2d3748; color: #e2e8f0; }
        .calc-gui-btn.operator { background: #3b82f6; color: white; }
        .calc-gui-btn.equals { background: #22c55e; color: white; }
        .calc-gui-btn.clear { background: #ef4444; color: white; }
        .calc-gui-btn.func { background: #8b5cf6; color: white; }

        .note-editor { display: flex; flex-direction: column; gap: 16px; }
        .note-split { display: flex; gap: 16px; min-height: 500px; flex-wrap: wrap; }
        .note-input-area, .note-preview-area { flex: 1; }
        .note-textarea { width: 100%; height: 400px; background: #0f172a; border: 1px solid #475569; border-radius: 16px; padding: 16px; color: #f1f5f9; font-family: monospace; resize: vertical; }
        .note-preview { background: #0f172a; border: 1px solid #475569; border-radius: 16px; padding: 16px; min-height: 400px; overflow-y: auto; }

        .report-container { max-width: 600px; margin: 0 auto; text-align: center; }
        .report-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .report-btn { padding: 14px 28px; border-radius: 60px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; }
        .report-btn.primary { background: #3b82f6; color: white; }
        .report-btn.secondary { background: #64748b; color: white; }

        .plugin-tabs { display: flex; gap: 8px; border-bottom: 1px solid #475569; margin-bottom: 20px; flex-wrap: wrap; }
        .plugin-tab { padding: 10px 24px; cursor: pointer; border-radius: 20px 20px 0 0; background: #1e293b; color: #e2e8f0; }
        .plugin-tab.active { background: #3b82f6; color: white; }
        body.light-mode .plugin-tab { background: #e2e8f0; color: #1e293b; }
        body.light-mode .plugin-tab.active { background: #3b82f6; color: white; }
        .plugin-pane { display: none; }
        .plugin-pane.active { display: block; }
        .map-container { width: 100%; height: 500px; border-radius: 24px; overflow: hidden; }
        .map-frame { width: 100%; height: 100%; border: none; }

        .transfer-message {
            background: #1e293b;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        body.light-mode .transfer-message { background: #f1f5f9; }
        .transfer-message .sender { font-weight: bold; color: #3b82f6; }
        .transfer-message .time { font-size: 0.7rem; color: #87b9ff; margin-left: 8px; }
        body.light-mode .transfer-message .time { color: #4a627a; }

        .paint-btn {
            background: #3b82f6;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .clickable-link { cursor: pointer; color: #3b82f6; text-decoration: underline; }

        .onscreen-keyboard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            z-index: 1000;
            border-top: 1px solid #475569;
            transform: translateY(100%);
            transition: transform 0.2s;
        }
        .onscreen-keyboard.show { transform: translateY(0); }
        body.light-mode .onscreen-keyboard { background: #f1f5f9; }
        .key-btn {
            background: #2d3748;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            min-width: 40px;
        }
        body.light-mode .key-btn { background: #cbd5e1; color: #1e293b; }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>
    <div class="acrylic-layer" id="acrylicLayer"></div>
    <div class="surfer-container" id="surferContainer">
        <!-- ========== 标签页 ========== -->
        <div class="tab-bar" id="tabBar">
            <!-- 标签页由 JavaScript 动态生成 -->
            <button class="tab-add-btn" id="addTabBtn">+</button>
        </div>
        <div class="toolbar">
            <div class="nav-buttons">
                <button class="nav-btn" id="backBtn">◀</button>
                <button class="nav-btn" id="forwardBtn">▶</button>
                <button class="nav-btn" id="reloadBtn">⟳</button>
            </div>
            <div class="url-bar">
                <input type="text" id="urlInput" class="url-input" placeholder="surfer:homepage" value="surfer:homepage">
                <button id="goBtn" class="go-btn">冲浪</button>
            </div>
            <button id="bossKeyBtn" class="boss-btn">B</button>
            <button id="pinKeyBtn" class="pin-btn">P</button>
            <button id="hideWindowBtn" class="hide-window-btn">隐藏</button>
            <button id="userBtn" class="user-btn">登录</button>
            <div class="status" id="statusMsg">Surfer2 6.20.00</div>
        </div>
        <div class="wave-area" id="waveArea">
            <iframe id="surfFrame" src="about:blank" style="display:none;"></iframe>
            <div id="internalContainer" style="width:100%;height:100%;overflow:auto;"></div>
        </div>
    </div>
    <div id="userMenu" class="user-menu">
        <div id="userMenuName" style="text-align:center; font-weight:bold;"></div>
        <div id="userMenuStatus" style="text-align:center; font-size:0.7rem; margin:4px 0;"></div>
        <div class="user-menu-item" id="menuChangeAvatar">修改头像</div>
        <div class="user-menu-item" id="menuBindGitHub">绑定 GitHub</div>
        <div class="user-menu-item" id="menuSwitchAccount">切换账号</div>
        <div class="user-menu-item" id="menuLogout">登出</div>
    </div>
    <div id="onscreenKeyboard" class="onscreen-keyboard">
        <button class="key-btn" data-key="1">1</button><button class="key-btn" data-key="2">2</button><button class="key-btn" data-key="3">3</button><button class="key-btn" data-key="4">4</button><button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button><button class="key-btn" data-key="7">7</button><button class="key-btn" data-key="8">8</button><button class="key-btn" data-key="9">9</button><button class="key-btn" data-key="0">0</button>
        <button class="key-btn" data-key="q">q</button><button class="key-btn" data-key="w">w</button><button class="key-btn" data-key="e">e</button><button class="key-btn" data-key="r">r</button><button class="key-btn" data-key="t">t</button>
        <button class="key-btn" data-key="y">y</button><button class="key-btn" data-key="u">u</button><button class="key-btn" data-key="i">i</button><button class="key-btn" data-key="o">o</button><button class="key-btn" data-key="p">p</button>
        <button class="key-btn" data-key="a">a</button><button class="key-btn" data-key="s">s</button><button class="key-btn" data-key="d">d</button><button class="key-btn" data-key="f">f</button><button class="key-btn" data-key="g">g</button>
        <button class="key-btn" data-key="h">h</button><button class="key-btn" data-key="j">j</button><button class="key-btn" data-key="k">k</button><button class="key-btn" data-key="l">l</button><button class="key-btn" data-key="z">z</button>
        <button class="key-btn" data-key="x">x</button><button class="key-btn" data-key="c">c</button><button class="key-btn" data-key="v">v</button><button class="key-btn" data-key="b">b</button><button class="key-btn" data-key="n">n</button>
        <button class="key-btn" data-key="m">m</button><button class="key-btn" data-key=".">.</button><button class="key-btn" data-key=",">,</button><button class="key-btn" data-key="/">/</button>
        <button class="key-btn" data-key="Backspace">⌫</button><button class="key-btn" data-key="Enter">↵</button><button id="closeKeyboardBtn" class="key-btn">关闭</button>
    </div>
    <script>
        (function(){
            // ========== DOM 元素 ==========
            const frame = document.getElementById('surfFrame');
            const internalContainer = document.getElementById('internalContainer');
            const urlInput = document.getElementById('urlInput');
            const goBtn = document.getElementById('goBtn');
            const backBtn = document.getElementById('backBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const reloadBtn = document.getElementById('reloadBtn');
            const statusSpan = document.getElementById('statusMsg');
            const bossBtn = document.getElementById('bossKeyBtn');
            const pinBtn = document.getElementById('pinKeyBtn');
            const hideBtn = document.getElementById('hideWindowBtn');
            const userBtn = document.getElementById('userBtn');
            const userMenu = document.getElementById('userMenu');
            const bgLayer = document.getElementById('bgLayer');
            const tabBar = document.getElementById('tabBar');
            const addTabBtn = document.getElementById('addTabBtn');
            
            // ========== 状态变量 ==========
            let enableBKey = localStorage.getItem('surfer2_enableBKey') !== 'false';
            let enablePKey = localStorage.getItem('surfer2_enablePKey') !== 'false';
            let enableOnscreenKeyboard = localStorage.getItem('surfer2_onscreenKeyboard') === 'true';
            
            // ========== 6.20.00 首页输入框焦点行为 ==========
            // 在 renderHomepage 中实现，见下方
            
            // ========== 防御模式 ==========
            let defenseMode = localStorage.getItem('surfer2_defense_mode') || 'none';
            let permanentTrust = JSON.parse(localStorage.getItem('surfer2_permanent_trust') || '[]');
            
            const defenseDescriptions = {
                'none': '无防御：不进行任何访问拦截（默认）',
                'low': '低防御：仅阻止 .com.cn、.cc、ww3. 等后缀的访问',
                'medium': '中等防御：在低防御基础上，额外阻止 .html 和 .htm 后缀的访问',
                'high': '强防御：在中等防御基础上，额外阻止 ftp 和 blog. 开头的链接',
                'extra': 'E强防御：仅允许 https、surfer:*、.gov/.mil/.edu 后缀，以及指定的豁免路径'
            };
            
            function isExemptUrl(url) {
                if(!url) return false;
                const exemptPatterns = [
                    'lkjy-coding.github.io',
                    'Surfer2',
                    'Surfer2ButTestVersions',
                    'JCom',
                    'Surfer'
                ];
                for(let pattern of exemptPatterns) {
                    if(url.indexOf(pattern) !== -1) return true;
                }
                return false;
            }
            
            function isPermanentTrusted(url) {
                if(!url) return false;
                for(let trusted of permanentTrust) {
                    if(url.indexOf(trusted) !== -1) return true;
                }
                return false;
            }
            
            // ========== 6.20.00 修复：URL标准化在防御之前 ==========
            function normalizeUrl(url) {
                let target = url.trim();
                if(!target) return '';
                if(target.startsWith('surfer:')) return target;
                if(target === 'about:blank') return target;
                if(!target.startsWith('http://') && !target.startsWith('https://')) {
                    // 如果看起来像域名（包含点或没有空格），补全 https://
                    if(target.includes('.') && !target.includes(' ')) {
                        target = 'https://' + target;
                    } else {
                        // 否则当作搜索词
                        target = 'https://www.google.com/search?q=' + encodeURIComponent(target);
                    }
                }
                return target;
            }
            
            function checkDefense(url) {
                if(defenseMode === 'none') return { blocked: false, reason: '' };
                if(isPermanentTrusted(url)) return { blocked: false, reason: '' };
                if(!url) return { blocked: false, reason: '' };
                
                const lowerUrl = url.toLowerCase();
                
                if(defenseMode === 'extra') {
                    if(url.startsWith('surfer:')) return { blocked: false, reason: '' };
                    if(lowerUrl.startsWith('https://')) return { blocked: false, reason: '' };
                    if(lowerUrl.match(/\.(gov|mil|edu)(\/|$)/)) return { blocked: false, reason: '' };
                    if(isExemptUrl(url)) return { blocked: false, reason: '' };
                    if(lowerUrl.indexOf('.html') !== -1 || lowerUrl.indexOf('.htm') !== -1) {
                        return { blocked: true, reason: 'E强防御模式禁止访问 .html / .htm 文件（除非在豁免列表）' };
                    }
                    return { blocked: true, reason: 'E强防御模式仅允许 HTTPS、内部域名和官方后缀 (.gov/.mil/.edu)' };
                }
                
                if(defenseMode === 'high') {
                    if(lowerUrl.startsWith('https://')) return { blocked: false, reason: '' };
                    if(url.startsWith('surfer:')) return { blocked: false, reason: '' };
                    if(lowerUrl.match(/\.(gov|mil|edu)(\/|$)/)) return { blocked: false, reason: '' };
                    if(lowerUrl.startsWith('ftp://') || lowerUrl.indexOf('ftp.') !== -1) {
                        return { blocked: true, reason: '强防御模式禁止访问 FTP 链接' };
                    }
                    if(lowerUrl.indexOf('blog.') !== -1) {
                        return { blocked: true, reason: '强防御模式禁止访问 blog. 子域名' };
                    }
                    if(lowerUrl.indexOf('.html') !== -1 || lowerUrl.indexOf('.htm') !== -1) {
                        return { blocked: true, reason: '强防御模式禁止访问 .html / .htm 文件' };
                    }
                    if(lowerUrl.indexOf('.com.cn') !== -1 || lowerUrl.indexOf('.cc') !== -1 || lowerUrl.indexOf('ww3.') !== -1) {
                        return { blocked: true, reason: '强防御模式禁止访问 .com.cn / .cc / ww3. 相关域名' };
                    }
                    return { blocked: false, reason: '' };
                }
                
                if(defenseMode === 'medium') {
                    if(lowerUrl.startsWith('https://')) return { blocked: false, reason: '' };
                    if(url.startsWith('surfer:')) return { blocked: false, reason: '' };
                    if(lowerUrl.match(/\.(gov|mil|edu)(\/|$)/)) return { blocked: false, reason: '' };
                    if(isExemptUrl(url)) return { blocked: false, reason: '' };
                    if(lowerUrl.indexOf('.html') !== -1 || lowerUrl.indexOf('.htm') !== -1) {
                        return { blocked: true, reason: '中等防御模式禁止访问 .html / .htm 文件' };
                    }
                    if(lowerUrl.indexOf('.com.cn') !== -1 || lowerUrl.indexOf('.cc') !== -1 || lowerUrl.indexOf('ww3.') !== -1) {
                        return { blocked: true, reason: '中等防御模式禁止访问 .com.cn / .cc / ww3. 相关域名' };
                    }
                    return { blocked: false, reason: '' };
                }
                
                if(defenseMode === 'low') {
                    if(lowerUrl.startsWith('https://')) return { blocked: false, reason: '' };
                    if(url.startsWith('surfer:')) return { blocked: false, reason: '' };
                    if(lowerUrl.match(/\.(gov|mil|edu)(\/|$)/)) return { blocked: false, reason: '' };
                    if(lowerUrl.indexOf('.com.cn') !== -1 || lowerUrl.indexOf('.cc') !== -1 || lowerUrl.indexOf('ww3.') !== -1) {
                        return { blocked: true, reason: '低防御模式禁止访问 .com.cn / .cc / ww3. 相关域名' };
                    }
                    return { blocked: false, reason: '' };
                }
                
                return { blocked: false, reason: '' };
            }
            
            // ========== 标签页系统 ==========
            let tabs = [];
            let activeTabIndex = 0;
            let tabIdCounter = 0;
            
            function loadTabs() {
                const saved = localStorage.getItem('surfer2_tabs');
                if(saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if(parsed && parsed.length > 0) {
                            tabs = parsed;
                            const savedActive = localStorage.getItem('surfer2_active_tab');
                            if(savedActive !== null) {
                                const idx = parseInt(savedActive);
                                if(idx >= 0 && idx < tabs.length) activeTabIndex = idx;
                            }
                            return;
                        }
                    } catch(e) {}
                }
                tabs = [{ id: tabIdCounter++, title: '主页', url: 'surfer:homepage', history: ['surfer:homepage'], historyIndex: 0 }];
                activeTabIndex = 0;
                saveTabs();
            }
            
            function saveTabs() {
                localStorage.setItem('surfer2_tabs', JSON.stringify(tabs));
                localStorage.setItem('surfer2_active_tab', activeTabIndex);
            }
            
            function renderTabs() {
                const addBtn = tabBar.querySelector('.tab-add-btn');
                tabBar.innerHTML = '';
                for(let i = 0; i < tabs.length; i++) {
                    const tab = tabs[i];
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (i === activeTabIndex ? ' active' : '');
                    btn.dataset.index = i;
                    btn.innerHTML = '<span>' + (tab.title || '新标签页') + '</span><span class="tab-close" data-index="' + i + '">✕</span>';
                    btn.onclick = function(e) {
                        if(e.target.classList.contains('tab-close')) return;
                        switchTab(i);
                    };
                    const closeSpan = btn.querySelector('.tab-close');
                    if(closeSpan) {
                        closeSpan.onclick = function(e) {
                            e.stopPropagation();
                            closeTab(i);
                        };
                    }
                    tabBar.appendChild(btn);
                }
                const newAddBtn = document.createElement('button');
                newAddBtn.className = 'tab-add-btn';
                newAddBtn.innerText = '+';
                newAddBtn.onclick = addTab;
                tabBar.appendChild(newAddBtn);
            }
            
            function switchTab(index) {
                if(index < 0 || index >= tabs.length) return;
                const currentTab = tabs[activeTabIndex];
                if(currentTab) {
                    const currentUrl = urlInput.value;
                    if(currentUrl && !currentUrl.startsWith('surfer:') && currentTab.url !== currentUrl) {
                        currentTab.url = currentUrl;
                        if(currentTab.history[currentTab.historyIndex] !== currentUrl) {
                            currentTab.history = currentTab.history.slice(0, currentTab.historyIndex + 1);
                            currentTab.history.push(currentUrl);
                            currentTab.historyIndex = currentTab.history.length - 1;
                        }
                        saveTabs();
                    }
                }
                activeTabIndex = index;
                const tab = tabs[index];
                if(tab) {
                    urlInput.value = tab.url || 'about:blank';
                    navigateTo(tab.url || 'about:blank', true);
                    if(tab.title) document.title = 'Surfer2 · ' + tab.title;
                }
                renderTabs();
                saveTabs();
            }
            
            function addTab() {
                const newTab = {
                    id: tabIdCounter++,
                    title: '新标签页',
                    url: 'surfer:homepage',
                    history: ['surfer:homepage'],
                    historyIndex: 0
                };
                tabs.push(newTab);
                activeTabIndex = tabs.length - 1;
                renderTabs();
                switchTab(activeTabIndex);
                saveTabs();
            }
            
            function closeTab(index) {
                if(tabs.length <= 1) {
                    tabs[0].url = 'surfer:homepage';
                    tabs[0].title = '主页';
                    tabs[0].history = ['surfer:homepage'];
                    tabs[0].historyIndex = 0;
                    activeTabIndex = 0;
                    renderTabs();
                    switchTab(0);
                    saveTabs();
                    return;
                }
                tabs.splice(index, 1);
                if(activeTabIndex >= tabs.length) activeTabIndex = tabs.length - 1;
                if(index <= activeTabIndex && activeTabIndex > 0) activeTabIndex--;
                renderTabs();
                switchTab(activeTabIndex);
                saveTabs();
            }
            
            function updateTabTitle(url) {
                const tab = tabs[activeTabIndex];
                if(!tab) return;
                let title = url;
                if(url.startsWith('surfer:')) {
                    title = url.replace('surfer:', '');
                    if(title === 'homepage') title = '主页';
                } else {
                    try {
                        const parsed = new URL(url);
                        title = parsed.hostname;
                    } catch(e) {}
                }
                tab.title = title;
                tab.url = url;
                if(tab.history[tab.historyIndex] !== url) {
                    tab.history = tab.history.slice(0, tab.historyIndex + 1);
                    tab.history.push(url);
                    tab.historyIndex = tab.history.length - 1;
                }
                saveTabs();
                renderTabs();
                document.title = 'Surfer2 · ' + title;
            }
            
            // ========== 防御拦截界面 ==========
            function showBlockedOverlay(url, reason) {
                const existing = document.querySelector('.blocked-overlay');
                if(existing) existing.remove();
                
                const overlay = document.createElement('div');
                overlay.className = 'blocked-overlay';
                overlay.innerHTML = `
                    <span>🛡️ 已阻止访问</span>
                    <span class="blocked-url">${escapeHtml(url)}</span>
                    <span class="blocked-reason">📋 ${escapeHtml(reason)}</span>
                    <div class="blocked-buttons">
                        <button class="blocked-trust-btn" id="blockedTrustOnce">✅ 一次性信任</button>
                        <button class="blocked-permanent-btn" id="blockedTrustPermanent">🔒 永久信任</button>
                        <button class="blocked-back-btn" id="blockedGoBack">◀ 返回</button>
                    </div>
                    <div class="blocked-search-box">
                        <input type="text" id="blockedSearchInput" placeholder="搜索...">
                        <button id="blockedSearchBtn">搜索</button>
                    </div>
                    <div class="blocked-settings">
                        <label><input type="checkbox" id="blockedHighContrast"> 高对比度</label>
                        <label><input type="checkbox" id="blockedKeyboard"> 屏幕键盘</label>
                        <button class="blocked-account-btn" id="blockedAccountBtn">👤 账号</button>
                    </div>
                `;
                document.body.appendChild(overlay);
                
                document.getElementById('blockedTrustOnce').onclick = function() {
                    overlay.remove();
                    loadUrlDirect(url);
                    statusSpan.innerText = '⏳ 一次性信任已启用，刷新后失效';
                };
                document.getElementById('blockedTrustPermanent').onclick = function() {
                    try {
                        const host = new URL(url).hostname;
                        if(host && !permanentTrust.includes(host)) {
                            permanentTrust.push(host);
                            localStorage.setItem('surfer2_permanent_trust', JSON.stringify(permanentTrust));
                        }
                    } catch(e) {
                        if(!permanentTrust.includes(url)) {
                            permanentTrust.push(url);
                            localStorage.setItem('surfer2_permanent_trust', JSON.stringify(permanentTrust));
                        }
                    }
                    overlay.remove();
                    loadUrlDirect(url);
                    statusSpan.innerText = '🔒 已添加永久信任';
                };
                document.getElementById('blockedGoBack').onclick = function() {
                    overlay.remove();
                    const tab = tabs[activeTabIndex];
                    if(tab && tab.historyIndex > 0) {
                        tab.historyIndex--;
                        const prevUrl = tab.history[tab.historyIndex];
                        urlInput.value = prevUrl;
                        navigateTo(prevUrl, true);
                    } else {
                        navigateTo('surfer:homepage', true);
                    }
                };
                document.getElementById('blockedSearchBtn').onclick = function() {
                    const query = document.getElementById('blockedSearchInput').value;
                    if(query) {
                        overlay.remove();
                        const searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                        urlInput.value = searchUrl;
                        navigateTo(searchUrl, true);
                    }
                };
                document.getElementById('blockedSearchInput').onkeypress = function(e) {
                    if(e.key === 'Enter') document.getElementById('blockedSearchBtn').click();
                };
                document.getElementById('blockedHighContrast').onchange = function() {
                    if(this.checked) document.body.classList.add('high-contrast');
                    else document.body.classList.remove('high-contrast');
                    localStorage.setItem('surfer2_highContrast', this.checked);
                };
                document.getElementById('blockedKeyboard').onchange = function() {
                    enableOnscreenKeyboard = this.checked;
                    localStorage.setItem('surfer2_onscreenKeyboard', this.checked);
                    const keyboard = document.getElementById('onscreenKeyboard');
                    if(this.checked) keyboard.classList.add('show');
                    else keyboard.classList.remove('show');
                };
                document.getElementById('blockedAccountBtn').onclick = function() {
                    if(currentUser) {
                        alert('当前登录: ' + currentUser.username);
                    } else {
                        login();
                    }
                };
            }
            
            function escapeHtml(str) {
                return str.replace(/[&<>]/g, function(m) {
                    return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
                });
            }
            
            // ========== 账号系统 ==========
            let currentUser = JSON.parse(localStorage.getItem('surfer2_user') || 'null');
            let users = JSON.parse(localStorage.getItem('surfer2_users') || '[]');
            
            function saveUsers() { localStorage.setItem('surfer2_users', JSON.stringify(users)); }
            function saveCurrentUser() { localStorage.setItem('surfer2_user', JSON.stringify(currentUser)); }
            function isAdmin() { return currentUser && currentUser.username === 'lkjy-coding'; }
            
            function login() {
                const name = prompt("输入用户名:");
                if(!name) return;
                let existing = users.find(u => u.username === name);
                if(existing) {
                    currentUser = existing;
                } else {
                    currentUser = { username: name, githubBound: false, avatar: null };
                    users.push(currentUser);
                    saveUsers();
                }
                saveCurrentUser();
                updateUserMenu();
                statusSpan.innerText = '欢迎 ' + name;
                closeUserMenu();
                if(internalContainer.innerHTML.includes('pin')) renderPinPage();
                if(internalContainer.innerHTML.includes('transfer')) renderTransferPage();
            }
            
            function logout() {
                if(!currentUser) return;
                currentUser = null;
                saveCurrentUser();
                updateUserMenu();
                closeUserMenu();
                statusSpan.innerText = '已登出';
                if(internalContainer.innerHTML.includes('pin')) renderPinPage();
                if(internalContainer.innerHTML.includes('transfer')) renderTransferPage();
                navigateTo('surfer:homepage');
            }
            
            function bindGitHub() {
                if(!currentUser) { alert('请先登录'); return; }
                if(currentUser.githubBound) { alert('已绑定'); return; }
                const githubName = prompt('请输入 GitHub 用户名:');
                if(githubName) {
                    currentUser.githubBound = true;
                    currentUser.githubName = githubName;
                    const idx = users.findIndex(u => u.username === currentUser.username);
                    if(idx !== -1) users[idx] = currentUser;
                    saveUsers();
                    saveCurrentUser();
                    updateUserMenu();
                    alert('绑定成功');
                }
            }
            
            function switchAccount() {
                if(users.length === 0) { alert('无其他账号'); return; }
                const list = users.map((u, i) => (i+1) + '. ' + u.username).join('\n');
                const choice = prompt('选择账号:\n' + list + '\n输入序号或用户名:');
                if(!choice) return;
                let target = null;
                if(!isNaN(parseInt(choice))) target = users[parseInt(choice)-1];
                else target = users.find(u => u.username === choice);
                if(target) {
                    currentUser = target;
                    saveCurrentUser();
                    updateUserMenu();
                    statusSpan.innerText = '切换到 ' + target.username;
                    closeUserMenu();
                }
            }
            
            function changeAvatar() {
                if(!currentUser) { alert('请先登录'); return; }
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            currentUser.avatar = ev.target.result;
                            const idx = users.findIndex(u => u.username === currentUser.username);
                            if(idx !== -1) users[idx] = currentUser;
                            saveUsers();
                            saveCurrentUser();
                            updateUserMenu();
                            alert('头像已更新');
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            }
            
            function updateUserMenu() {
                if(currentUser) {

            // ========== 导航核心 ==========
            function loadUrlDirect(url) {
                frame.style.display = 'block';
                internalContainer.style.display = 'none';
                frame.src = url;
                const tab = tabs[activeTabIndex];
                if(tab) {
                    tab.url = url;
                    if(tab.history[tab.historyIndex] !== url) {
                        tab.history = tab.history.slice(0, tab.historyIndex + 1);
                        tab.history.push(url);
                        tab.historyIndex = tab.history.length - 1;
                    }
                    updateTabTitle(url);
                }
            }
            
            function navigateTo(url, fromTabSwitch = false) {
                let target = url.trim();
                if(!target) return;
                
                // ========== 6.20.00 修复：先标准化URL，再检查防御 ==========
                const normalized = normalizeUrl(target);
                const defenseResult = checkDefense(normalized);
                if(defenseResult.blocked && !fromTabSwitch) {
                    showBlockedOverlay(normalized, defenseResult.reason);
                    return;
                }
                target = normalized;
                
                if(target.startsWith('surfer:')) {
                    const page = target.slice(7).split('?')[0];
                    const validPages = ['homepage','settings','note','chess','easyabroad','paintboard','pages','pin','report','translate','count','chajian','transfer'];
                    if(validPages.includes(page)) {
                        renderInternalPage(page);
                        const tab = tabs[activeTabIndex];
                        if(tab) {
                            tab.url = target;
                            if(tab.history[tab.historyIndex] !== target) {
                                tab.history = tab.history.slice(0, tab.historyIndex + 1);
                                tab.history.push(target);
                                tab.historyIndex = tab.history.length - 1;
                            }
                            updateTabTitle(target);
                        }
                        urlInput.value = target;
                        return;
                    }
                }
                if(target === 'about:blank') {
                    frame.style.display = 'block';
                    internalContainer.style.display = 'none';
                    frame.src = 'about:blank';
                    const tab = tabs[activeTabIndex];
                    if(tab) {
                        tab.url = target;
                        if(tab.history[tab.historyIndex] !== target) {
                            tab.history = tab.history.slice(0, tab.historyIndex + 1);
                            tab.history.push(target);
                            tab.historyIndex = tab.history.length - 1;
                        }
                        updateTabTitle(target);
                    }
                    urlInput.value = target;
                    statusSpan.innerText = '空白页';
                    return;
                }
                frame.style.display = 'block';
                internalContainer.style.display = 'none';
                frame.src = target;
                const tab = tabs[activeTabIndex];
                if(tab) {
                    tab.url = target;
                    if(tab.history[tab.historyIndex] !== target) {
                        tab.history = tab.history.slice(0, tab.historyIndex + 1);
                        tab.history.push(target);
                        tab.historyIndex = tab.history.length - 1;
                    }
                    updateTabTitle(target);
                }
                urlInput.value = target;
            }

            function attachChessEvents() {
                const container = document.getElementById('chessBoard');

                function checkWinner(board) {
                    const lines = [
                        [0,1,2], [3,4,5], [6,7,8],
                        [0,3,6], [1,4,7], [2,5,8],
                        [0,4,8], [2,4,6]
                    ];
                    for(let i=0;i<lines.length;i++) {
                        const [a,b,c] = lines[i];
                        if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                            return board[a];
                        }
                    }
                    if(board.every(cell => cell !== '')) return 'tie';
                    return null;
                }

                    if(!container) return;
                    container.innerHTML = '';
                    for(let i=0;i<9;i++) {

                        cell.className = 'game-cell';
                        cell.innerText = chessBoard[i];
                        if(chessActive && chessBoard[i]==='' && chessTurn==='X' && !chessWinner) {
                            cell.onclick = (function(idx) { return function() { playerMove(idx); }; })(i);
                        }
                        container.appendChild(cell);
                    }
                }
                
                function endGame(w) {
                    chessActive = false;
                    chessWinner = w;
                    if(w === 'X') statusSpanChess.innerText = '你赢了！';
                    else if(w === 'O') statusSpanChess.innerText = 'AI赢了！';
                    else if(w === 'tie') statusSpanChess.innerText = '平局！';
                    updateBoard();
                }
                
                function aiMove() {
                    if(!chessActive || chessTurn !== 'O' || chessWinner) return;
                    const empty = [];
                    for(let i=0;i<9;i++) if(chessBoard[i]==='') empty.push(i);
                    if(empty.length === 0) return;
                    const move = empty[Math.floor(Math.random() * empty.length)];
                    chessBoard[move] = 'O';
                    const w = checkWinner(chessBoard);
                    if(w) {
                        endGame(w);
                        return;
                    }
                    chessTurn = 'X';
                    updateBoard();
                }
                
                function playerMove(i) {
                    if(!chessActive || chessTurn !== 'X' || chessBoard[i] !== '' || chessWinner) return;
                    chessBoard[i] = 'X';
                    const w = checkWinner(chessBoard);
                    if(w) {
                        endGame(w);
                        return;
                    }
                    chessTurn = 'O';
                    updateBoard();
                    setTimeout(aiMove, 100);
                }
                
                const resetBtn = document.getElementById('resetChessBtn');
                if(resetBtn) resetBtn.onclick = function() {
                    chessBoard = ['', '', '', '', '', '', '', '', ''];
                    chessActive = true;
                    chessTurn = 'X';
                    chessWinner = null;
                    statusSpanChess.innerText = '你的回合';
                    updateBoard();
                };
                updateBoard();
                statusSpanChess.innerText = '你的回合';
            }

            function attachCountEvents() {
                let expr = '';
                const display = document.getElementById('calcDisplay');
                function update() { display.innerText = expr || '0'; }
                function calc() {
                    try {
                        let e = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**');
                        e = e.replace(/√\(?([^)]+)\)?/g,'Math.sqrt($1)').replace(/(\d+)²/g,'Math.pow($1,2)');
                        e = e.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/π/g,'Math.PI');
                        const result = eval(e);
                        document.getElementById('calcResultArea').innerHTML = '结果: ' + result;
                        expr = result.toString();
                        update();
                    } catch(e) { document.getElementById('calcResultArea').innerHTML = '错误: ' + e.message; }
                }
                function handle(v) {
                    if(v === 'clear') { expr = ''; document.getElementById('calcResultArea').innerHTML = ''; update(); }
                    else if(v === 'back') { expr = expr.slice(0,-1); update(); }
                    else if(v === 'equals') { calc(); }
                    else if(v === 'sqrt') { expr += '√('; update(); }
                    else if(v === 'pow') { expr += '²'; update(); }
                    else if(v === 'sin') { expr += 'sin('; update(); }
                    else if(v === 'cos') { expr += 'cos('; update(); }
                    else if(v === 'tan') { expr += 'tan('; update(); }
                    else if(v === 'pi') { expr += 'π'; update(); }
                    else { expr += v; update(); }
                }
                document.querySelectorAll('.calc-gui-btn[data-num]').forEach(b => b.onclick = () => handle(b.dataset.num));
                document.querySelectorAll('.calc-gui-btn[data-op]').forEach(b => b.onclick = () => handle(b.dataset.op));
                document.querySelector('[data-action="clear"]').onclick = () => handle('clear');
                document.querySelector('[data-action="back"]').onclick = () => handle('back');
                document.querySelector('[data-action="equals"]').onclick = () => handle('equals');
                document.querySelectorAll('.calc-gui-btn[data-func]').forEach(b => b.onclick = () => handle(b.dataset.func));
                
                const currencyBtn = document.getElementById('currencyCalcBtn');
                if(currencyBtn) currencyBtn.onclick = async function() {
                    const amount = parseFloat(document.getElementById('currencyAmount').value);
                    const from = document.getElementById('currencyFrom').value;
                    const to = document.getElementById('currencyTo').value;
                    try {
                        const res = await fetch('https://api.exchangerate-api.com/v4/latest/' + from);
                        const data = await res.json();
                        const rate = data.rates[to];
                        let fromDisplay = from === 'CNY' ? '人民币' : from;
                        let toDisplay = to === 'CNY' ? '人民币' : to;
                        document.getElementById('currencyResult').innerHTML = amount + ' ' + fromDisplay + ' = ' + (amount * rate).toFixed(4) + ' ' + toDisplay;
                    } catch(e) {
                        document.getElementById('currencyResult').innerHTML = '汇率获取失败';
                    }
                };
            }

                    };
                }
                const irBtn = document.getElementById('irTestBtn');
                if(irBtn) irBtn.onclick = function() { document.getElementById('irResult').innerHTML = '红外信号已发送（模拟）'; };
            }
            
            function renderInternalPage(pageId) {
                frame.style.display = 'none';
                internalContainer.style.display = 'block';
                internalContainer.innerHTML = '';
                if(pageId === 'homepage') {
                    internalContainer.innerHTML = renderHomepage();
                    setTimeout(() => {
                        const searchBtn = document.getElementById('homeSearchBtn');
                        const searchInput = document.getElementById('homeSearchInput');
                        const engineSelect = document.getElementById('homeEngineSelect');
                        const pureCheckbox = document.getElementById('pureSearchCheckbox');
                        if(searchBtn) searchBtn.onclick = () => {
                            if(searchInput.value) {
                                let query = searchInput.value;
                                if(pureCheckbox && pureCheckbox.checked) query += ' -surfer';
                                let engine = engineSelect.value;
                                let url = '';
                                if(engine === 'google') url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                                else if(engine === 'bing') url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
                                else if(engine === 'baidu') url = 'https://www.baidu.com/s?wd=' + encodeURIComponent(query);
                                else url = 'https://github.com/search?q=' + encodeURIComponent(query);
                                navigateTo(url);
                            }
                        };
                        const savedEngine = localStorage.getItem('surfer2_defaultEngine') || 'google';
                        if(engineSelect) engineSelect.value = savedEngine;
                        // 首页输入框焦点行为
                        setupHomepageInputBehavior();
                    }, 50);
                } else if(pageId === 'settings') {
                    internalContainer.innerHTML = renderSettingsPage();
                    attachSettingsEvents();
                } else if(pageId === 'pages') {
                    internalContainer.innerHTML = renderPagesPage();
                    attachPagesEvents();
                } else if(pageId === 'note') {
                    internalContainer.innerHTML = renderNotePage();
                    attachNoteEvents();
                } else if(pageId === 'pin') {
                    internalContainer.innerHTML = renderPinPage();
                    attachPinEvents();
                } else if(pageId === 'chess') {
                    internalContainer.innerHTML = renderChessPage();
                    attachChessEvents();
                } else if(pageId === 'translate') {
                    internalContainer.innerHTML = renderTranslatePage();
                    attachTranslateEvents();
                } else if(pageId === 'count') {
                    internalContainer.innerHTML = renderCountPage();
                    attachCountEvents();
                } else if(pageId === 'report') {
                    internalContainer.innerHTML = renderReportPage();
                    attachReportEvents();
                } else if(pageId === 'chajian') {
                    internalContainer.innerHTML = renderChajianPage();
                    attachChajianEvents();
                } else if(pageId === 'easyabroad') {
                    internalContainer.innerHTML = renderEasyAbroadPage();
                } else if(pageId === 'paintboard') {
                    internalContainer.innerHTML = renderPaintBoardPage();
                } else if(pageId === 'transfer') {
                    internalContainer.innerHTML = renderTransferPage();
                    attachTransferEvents();
                } else {
                    internalContainer.innerHTML = '<div class="internal-page"><h2>未知域名</h2></div>';
                }
                statusSpan.innerText = pageId;
                urlInput.value = 'surfer:' + pageId;
                updateUserMenu();
            }
            
            // ========== 导航 ==========
            function goBack() {
                const tab = tabs[activeTabIndex];
                if(tab && tab.historyIndex > 0) {
                    tab.historyIndex--;
                    const prevUrl = tab.history[tab.historyIndex];
                    urlInput.value = prevUrl;
                    navigateTo(prevUrl, true);
                } else {
                    statusSpan.innerText = '没有更早的历史';
                }
            }
            
            function goForward() {
                const tab = tabs[activeTabIndex];
                if(tab && tab.historyIndex < tab.history.length - 1) {
                    tab.historyIndex++;
                    const nextUrl = tab.history[tab.historyIndex];
                    urlInput.value = nextUrl;
                    navigateTo(nextUrl, true);
                } else {
                    statusSpan.innerText = '没有更新的历史';
                }
            }
            
            function reloadCurrent() {
                const current = urlInput.value;
                if(current.startsWith('surfer:')) {
                    renderInternalPage(current.slice(7));
                } else if(frame.src && frame.src !== 'about:blank') {
                    frame.src = frame.src;
                }
            }
            
            // ========== 初始化 ==========
            const keyboard = document.getElementById('onscreenKeyboard');
            function updateKeyboard() {
                if(enableOnscreenKeyboard) keyboard.classList.add('show');
                else keyboard.classList.remove('show');
            }
            updateKeyboard();
            
            loadTabs();
            
            if(tabs.length > 0 && tabs[activeTabIndex]) {
                const initialTab = tabs[activeTabIndex];
                urlInput.value = initialTab.url || 'surfer:homepage';
                switchTab(activeTabIndex);
            }
            
            backBtn.onclick = goBack;
            forwardBtn.onclick = goForward;
            reloadBtn.onclick = reloadCurrent;
            goBtn.onclick = function() { 
                const url = urlInput.value;
                const tab = tabs[activeTabIndex];
                if(tab) {
                    tab.url = url;
                    tab.history = tab.history.slice(0, tab.historyIndex + 1);
                    tab.history.push(url);
                    tab.historyIndex = tab.history.length - 1;
                    saveTabs();
                }
                navigateTo(url); 
            };
            urlInput.onkeypress = function(e) { if(e.key === 'Enter') goBtn.click(); };
            
            bossBtn.onclick = function() { navigateTo('surfer:settings'); };
            pinBtn.onclick = function() {
                if(!currentUser) {
                    alert('请先登录后再使用快捷方式功能');
                    login();
                } else {
                    navigateTo('surfer:pin');
                }
            };
            
            document.addEventListener('keydown', function(e) {
                if(isInputFocused()) return;
                if((e.key === 'b' || e.key === 'B') && enableBKey) {
                    e.preventDefault();
                    navigateTo('surfer:settings');
                }
                if((e.key === 'p' || e.key === 'P') && enablePKey) {
                    e.preventDefault();
                    if(!currentUser) {
                        alert('请先登录后再使用快捷方式功能');
                        login();
                    } else {
                        navigateTo('surfer:pin');
                    }
                }
            });
            
            let isWindowHidden = false;
            hideBtn.onclick = function() {
                const c = document.querySelector('.surfer-container');
                if(!isWindowHidden) {
                    c.style.opacity = '0';
                    c.style.visibility = 'hidden';
                    isWindowHidden = true;
                    const restore = document.createElement('button');
                    restore.innerText = '显示窗口';
                    restore.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:10000;background:#3b82f6;border:none;padding:8px 16px;border-radius:40px;color:white;cursor:pointer';
                    restore.onclick = function() {
                        c.style.opacity = '1';
                        c.style.visibility = 'visible';
                        isWindowHidden = false;
                        restore.remove();
                    };
                    document.body.appendChild(restore);
                }
            };
            
            window.addEventListener('resize', function() {
                const container = document.querySelector('.surfer-container');
                if(container) container.style.height = 'calc(100vh - 32px)';
            });
            setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 100);
            
            updateUserMenu();
        })();
    </script>
</body>
  </html>
