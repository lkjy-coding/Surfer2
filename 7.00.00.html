<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://surfer2-oauth-main.workers.dev https://surfer2-oauth-backup.vercel.app;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://avatars.githubusercontent.com;
        connect-src 'self' https://surfer2-oauth-main.workers.dev https://surfer2-oauth-backup.vercel.app https://api.github.com;
        frame-src 'self' https://surfer2-oauth-main.workers.dev https://surfer2-oauth-backup.vercel.app;
        base-uri 'self';
        form-action 'self';
    ">
    <title>Surfer2 · 更懂浏览更懂你</title>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background-color 0.2s;
            margin: 0;
        }

        /* ===== 高对比度模式 ===== */
        body.high-contrast { background: #000 !important; }
        body.high-contrast .surfer-container,
        body.high-contrast .toolbar,
        body.high-contrast .internal-page,
        body.high-contrast .settings-group,
        body.high-contrast .calc-gui,
        body.high-contrast .calc-display,
        body.high-contrast .game-cell,
        body.high-contrast .game-board,
        body.high-contrast .translate-box,
        body.high-contrast .note-textarea,
        body.high-contrast .note-preview,
        body.high-contrast .pin-add,
        body.high-contrast .pin-item,
        body.high-contrast .page-card,
        body.high-contrast .plugin-tab,
        body.high-contrast .map-container,
        body.high-contrast .transfer-message,
        body.high-contrast .tab-bar,
        body.high-contrast .tab-btn,
        body.high-contrast .session-card,
        body.high-contrast .settings-sidebar,
        body.high-contrast .settings-content,
        body.high-contrast .dashboard-card,
        body.high-contrast .user-menu {
            background: #000 !important;
            border-color: #fff !important;
            color: #fff !important;
        }
        body.high-contrast button,
        body.high-contrast .calc-gui-btn,
        body.high-contrast .go-btn,
        body.high-contrast .report-btn { background: #333 !important; color: #fff !important; border: 1px solid #fff !important; }
        body.high-contrast a { color: #ff0 !important; }
        body.high-contrast #userMenuName { color: #fff !important; }

        /* ===== 浅色模式 ===== */
        body.light-mode { background: #e2e8f0; }
        body.light-mode .surfer-container {
            background: #ffffff;
            border-color: #cbd5e1;
        }
        body.light-mode .toolbar {
            background: #f1f5f9 !important;
            border-bottom-color: #e2e8f0 !important;
        }
        body.light-mode .nav-buttons {
            background: #e2e8f0 !important;
        }
        body.light-mode .nav-btn {
            background: #cbd5e1 !important;
            color: #1e293b !important;
        }
        body.light-mode .url-bar {
            background: #e2e8f0 !important;
        }
        body.light-mode .url-input {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
        }
        body.light-mode .status {
            background: #e2e8f0 !important;
            color: #475569 !important;
        }
        body.light-mode .hamburger-menu {
            background: #e2e8f0 !important;
        }
        body.light-mode .hamburger-menu span {
            color: #1e293b !important;
        }
        body.light-mode .tab-bar {
            background: #f1f5f9 !important;
            border-bottom-color: #e2e8f0 !important;
        }
        body.light-mode .tab-btn {
            background: #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-mode .tab-btn.active {
            background: #3b82f6 !important;
            color: #fff !important;
        }

        body.light-mode .internal-page {
            background: #f8fafc !important;
            color: #1e293b !important;
        }
        body.light-mode .settings-sidebar {
            background: #ffffff !important;
            border-color: #e2e8f0 !important;
        }
        body.light-mode .settings-sidebar-item {
            color: #475569 !important;
        }
        body.light-mode .settings-sidebar-item.active {
            background: #3b82f6 !important;
            color: #fff !important;
        }
        body.light-mode .settings-sidebar-item:hover {
            background: #e2e8f0 !important;
        }
        body.light-mode .settings-content {
            background: #ffffff !important;
            border-color: #e2e8f0 !important;
        }
        body.light-mode .settings-group {
            background: #f1f5f9 !important;
            border: 1px solid #e2e8f0 !important;
        }
        body.light-mode .settings-group label {
            color: #1e293b !important;
        }

        body.light-mode .user-menu {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
        }
        body.light-mode .user-menu-item {
            color: #1e293b !important;
        }
        body.light-mode .user-menu-item:hover {
            background: #e2e8f0 !important;
        }
        body.light-mode #userMenuName {
            color: #1e293b !important;
        }
        body.light-mode #userMenuLogin {
            color: #475569 !important;
        }

        body.light-mode .dashboard-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        body.light-mode .dashboard-card:hover {
            background: #e2e8f0 !important;
        }
        body.light-mode .dashboard-card .card-desc {
            color: #4a627a !important;
        }

        body.light-mode .video-upload-area {
            background: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
        }

        body.light-mode .user-btn {
            background: #e2e8f0 !important;
            color: #1e293b !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .user-btn:hover {
            background: #cbd5e1 !important;
        }
        body.light-mode .user-btn.logged-in {
            border-color: #22c55e !important;
        }

        body.light-mode .hamburger-dropdown {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
        }
        body.light-mode .hamburger-item {
            color: #1e293b !important;
        }
        body.light-mode .hamburger-item:hover {
            background: #e2e8f0 !important;
        }

        body.light-mode .refresh-dialog {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
        }
        body.light-mode .refresh-dialog h3 {
            color: #1e293b !important;
        }
        body.light-mode .refresh-dialog p {
            color: #475569 !important;
        }
        body.light-mode .refresh-dialog .dialog-checkbox {
            color: #475569 !important;
        }

        body.light-mode .blocked-overlay {
            background: rgba(255,255,255,0.95) !important;
            color: #1e293b !important;
        }
        body.light-mode .blocked-overlay .blocked-url {
            color: #3b82f6 !important;
        }
        body.light-mode .blocked-overlay .blocked-reason {
            color: #d97706 !important;
        }

        /* ===== 背景层 ===== */
        .bg-layer { position: fixed; top:0;left:0;width:100%;height:100%;z-index:-2;background-size:cover;background-position:center; }
        .acrylic-layer { position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;transition:opacity .35s;opacity:0;background:rgba(14,20,39,0.6);backdrop-filter:blur(20px) saturate(180%); }
        body.acrylic-active .acrylic-layer { opacity:1; }

        /* ===== 主容器 ===== */
        .surfer-container {
            width:100%; max-width:1400px; height:calc(100vh - 32px);
            background:#0e1427; border-radius:32px; box-shadow:0 25px 45px rgba(0,0,0,0.5);
            display:flex; flex-direction:column; overflow:hidden;
            border:1px solid #2d3e5f; position:relative; z-index:1; margin:0 auto;
        }
        body.light-mode .surfer-container { background:#fff; border-color:#cbd5e1; }
        body.acrylic-active .surfer-container { background:rgba(14,20,39,0.65); backdrop-filter:blur(10px); border-color:rgba(255,255,255,0.25); }

        /* ===== 标签栏 ===== */
        .tab-bar {
            display:flex; background:#111927cc; backdrop-filter:blur(8px);
            padding:4px 12px; border-bottom:1px solid #2a3a55; gap:4px;
            flex-wrap:nowrap; overflow-x:auto; flex-shrink:0; align-items:center;
        }
        .tab-btn {
            background:#1e293b; border:none; padding:4px 12px; border-radius:16px;
            color:#87b9ff; cursor:pointer; font-size:0.75rem; white-space:nowrap;
            display:inline-flex; align-items:center; gap:4px;
        }
        .tab-btn.active { background:#3b82f6; color:#fff; }
        .tab-btn .tab-close { margin-left:4px; font-size:0.6rem; opacity:0.6; cursor:pointer; }
        .tab-btn .tab-close:hover { opacity:1; }
        .tab-add-btn { background:transparent; border:1px solid #3b82f6; color:#3b82f6; border-radius:16px; padding:2px 12px; cursor:pointer; font-size:0.8rem; }

        /* ===== 工具栏 ===== */
        .toolbar {
            background:#111927cc; backdrop-filter:blur(8px);
            padding:8px 16px; border-bottom:1px solid #2a3a55;
            display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex-shrink:0;
        }
        .nav-buttons { display:flex; gap:6px; background:#0b101e99; padding:4px 10px; border-radius:48px; }
        .nav-btn { background:#1e2a3e; border:none; color:#b4d0ff; font-size:1.2rem; width:32px; height:32px; border-radius:40px; cursor:pointer; }
        .url-bar { flex:1; display:flex; gap:6px; background:#0b101e99; padding:4px 12px; border-radius:60px; align-items:center; min-width:150px; }
        .url-input { flex:1; background:#010a1a; border:1px solid #2c5270; padding:8px 14px; border-radius:48px; color:#c0e0ff; font-size:0.85rem; outline:none; min-width:100px; transition:color 0.2s; }
        .url-input.homepage-focused { color:#4a627a; font-style:italic; }
        .go-btn { background:#1f6392; border:none; padding:5px 14px; border-radius:40px; color:#fff; cursor:pointer; font-size:0.75rem; }
        .status { font-size:0.65rem; background:#030a17aa; padding:3px 10px; border-radius:20px; color:#87b9ff; }

        /* ===== 用户按钮（OAuth 版） ===== */
        .user-btn {
            display:flex; align-items:center; gap:8px;
            background:#1e2a3e; border:none; padding:4px 14px 4px 10px;
            border-radius:32px; color:#b4d0ff; cursor:pointer;
            font-size:0.8rem; transition:all 0.2s;
            border:1px solid #2d3e5f;
        }
        .user-btn:hover { background:#2d3e5f; border-color:#3b82f6; }
        .user-btn .user-avatar {
            width:22px; height:22px; border-radius:50%;
            object-fit:cover; background:#2d3e5f;
            display:none;
        }
        .user-btn .user-name {
            max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        }
        .user-btn.logged-in { border-color:#22c55e; }
        .user-btn .login-icon { font-size:1rem; }

        /* ===== 三杠菜单 ===== */
        .hamburger-menu {
            display:flex; align-items:center; gap:6px; background:#1e2a3e; padding:4px 12px; border-radius:40px; cursor:pointer;
            user-select:none; -webkit-user-select:none;
            transition:background 0.15s;
            position:relative; z-index:10;
        }
        .hamburger-menu:hover { background:#2d3e5f; }
        .hamburger-menu span { color:#b4d0ff; font-size:1.2rem; pointer-events:none; }

        .hamburger-dropdown {
            position:absolute; top:60px; right:20px; background:#1e293b; border-radius:20px; padding:12px;
            min-width:200px; z-index:9999; display:none; border:1px solid #475569;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }
        .hamburger-dropdown.show { display:block; }
        .hamburger-item {
            padding:8px 12px; cursor:pointer; border-radius:12px; color:#e2e8f0;
            transition:background 0.15s;
        }
        .hamburger-item:hover { background:#2d3e5f; }

        /* ===== 用户菜单（OAuth 版） ===== */
        .user-menu {
            position: absolute; top: 60px; right: 20px; background: #1e293b; border-radius: 20px;
            padding: 12px; min-width: 200px; z-index: 9998; display: none; border: 1px solid #475569;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .user-menu.show { display: block; }
        .user-menu-item {
            padding: 8px 12px; cursor: pointer; border-radius: 12px; color: #e2e8f0;
            transition: background 0.15s;
        }
        .user-menu-item:hover { background: #2d3e5f; }
        .user-menu .user-avatar-large {
            width:48px; height:48px; border-radius:50%;
            margin:0 auto 8px; display:block;
            border:2px solid #3b82f6;
        }
        .user-menu .user-info {
            text-align:center; margin-bottom:12px;
        }
        .user-menu .user-info .name {
            font-weight:bold; font-size:1rem;
        }
        .user-menu .user-info .login {
            font-size:0.8rem; color:#87b9ff;
        }
        .user-menu .divider {
            border-top:1px solid #475569; margin:6px 0;
        }

        /* ===== 内部页面 ===== */
        .internal-page { width:100%; min-height:100%; background:#0f172a; color:#e2e8f0; padding:20px; overflow-y:auto; }
        .wave-area { flex:1; position:relative; overflow:auto; min-height:0; }
        iframe { width:100%; height:100%; border:none; background:#fff; display:block; }

        /* ===== Dashboard ===== */
        .dashboard-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap:16px;
            margin-top:20px;
        }
        .dashboard-card {
            background:#1e293b;
            border-radius:20px;
            padding:24px 16px;
            text-align:center;
            cursor:pointer;
            transition:all 0.2s ease;
            border:1px solid #2d3e5f;
            color:#e2e8f0;
        }
        .dashboard-card:hover {
            transform:translateY(-4px);
            background:#2d3e5f;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }
        .dashboard-card .card-icon { font-size:2.5rem; margin-bottom:8px; }
        .dashboard-card .card-title { font-size:1rem; font-weight:bold; }
        .dashboard-card .card-desc { font-size:0.7rem; color:#87b9ff; margin-top:4px; }

        /* ===== 设置 ===== */
        .settings-layout {
            display:flex; gap:20px; height:100%; min-height:500px;
        }
        .settings-sidebar {
            width:220px; flex-shrink:0; background:#1e293b; border-radius:16px; padding:12px 0;
            border:1px solid #2d3e5f;
        }
        .settings-sidebar-item {
            padding:10px 20px; cursor:pointer; border-radius:8px; margin:2px 8px;
            color:#87b9ff;
        }
        .settings-sidebar-item.active { background:#3b82f6; color:#fff; }
        .settings-sidebar-item:hover { background:#2d3e5f; }
        .settings-content {
            flex:1; background:#1e293b; border-radius:16px; padding:20px;
            border:1px solid #2d3e5f; overflow-y:auto;
        }
        .settings-group { margin-bottom:20px; padding:12px; background:#0f172a; border-radius:16px; }
        .settings-group label { display:block; margin:6px 0; }

        /* ===== Pin ===== */
        .pin-container { display:flex;flex-direction:column;gap:20px; }
        .pin-add { display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#1e293b;padding:16px;border-radius:24px; }
        .pin-add input { flex:1;padding:10px 16px;border-radius:40px;background:#0f172a;border:1px solid #475569;color:inherit; }
        .pin-list { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px; }
        .pin-item { background:#1e293b;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer; }
        .pin-item .pin-delete { background:#ef4444;border:none;padding:4px 12px;border-radius:20px;color:#fff;cursor:pointer; }

        /* ===== Chess ===== */
        .game-board { display:grid;gap:2px;justify-content:center;margin:20px auto;background:#2d3748;padding:10px;border-radius:16px;grid-template-columns:repeat(3,80px); }
        .game-cell { background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold;cursor:pointer;aspect-ratio:1/1;min-width:30px; }

        /* ===== Translate ===== */
        .translate-container { max-width:900px;margin:0 auto; }
        .translate-box { background:#1e293b;border-radius:24px;padding:20px; }
        .translate-textarea { width:100%;height:150px;padding:12px;border-radius:16px;background:#0f172a;border:1px solid #475569;resize:vertical; }

        /* ===== Count ===== */
        .calc-gui { background:#1e293b;border-radius:24px;padding:20px;margin-top:16px; }
        .calc-display { background:#0f172a;border-radius:20px;padding:20px;margin-bottom:20px;font-family:monospace;font-size:1.8rem;text-align:right;min-height:80px; }
        .calc-gui-row { display:flex;gap:10px;margin-bottom:10px; }
        .calc-gui-btn { flex:1;padding:16px 8px;font-size:1.2rem;font-weight:bold;border:none;border-radius:20px;cursor:pointer;background:#2d3748;color:#e2e8f0; }
        .calc-gui-btn.operator { background:#3b82f6;color:#fff; }
        .calc-gui-btn.equals { background:#22c55e;color:#fff; }
        .calc-gui-btn.clear { background:#ef4444;color:#fff; }
        .calc-gui-btn.func { background:#8b5cf6;color:#fff; }

        /* ===== Note ===== */
        .note-editor { display:flex;flex-direction:column;gap:16px; }
        .note-split { display:flex;gap:16px;min-height:500px;flex-wrap:wrap; }
        .note-input-area, .note-preview-area { flex:1; }
        .note-textarea { width:100%;height:400px;background:#0f172a;border:1px solid #475569;border-radius:16px;padding:16px;color:#f1f5f9;font-family:monospace;resize:vertical; }
        .note-preview { background:#0f172a;border:1px solid #475569;border-radius:16px;padding:16px;min-height:400px;overflow-y:auto; }

        /* ===== Report ===== */
        .report-container { max-width:600px;margin:0 auto;text-align:center; }
        .report-buttons { display:flex;gap:20px;justify-content:center;margin-top:30px;flex-wrap:wrap; }
        .report-btn { padding:14px 28px;border-radius:60px;font-size:1.1rem;font-weight:bold;cursor:pointer;border:none; }
        .report-btn.primary { background:#3b82f6;color:#fff; }

        /* ===== Chajian ===== */
        .plugin-tabs { display:flex;gap:8px;border-bottom:1px solid #475569;margin-bottom:20px;flex-wrap:wrap; }
        .plugin-tab { padding:10px 24px;cursor:pointer;border-radius:20px 20px 0 0;background:#1e293b;color:#e2e8f0; }
        .plugin-tab.active { background:#3b82f6;color:#fff; }
        .plugin-pane { display:none; }
        .plugin-pane.active { display:block; }
        .map-container { width:100%;height:500px;border-radius:24px;overflow:hidden; }
        .map-frame { width:100%;height:100%;border:none; }

        /* ===== Transfer ===== */
        .transfer-message { background:#1e293b;border-radius:16px;padding:12px;margin-bottom:12px; }
        .transfer-message .sender { font-weight:bold;color:#3b82f6; }
        .transfer-message .time { font-size:0.7rem;color:#87b9ff;margin-left:8px; }

        .session-card { background:#1e293b;border-radius:24px;padding:24px;margin-bottom:20px;text-align:center;cursor:pointer;transition:.2s;border:1px solid #2d3e5f; }
        .session-card:hover { transform:translateY(-4px);background:#2d3e5f; }
        .session-card .session-icon { font-size:2.5rem;margin-bottom:8px; }
        .session-card .session-title { font-size:1.2rem;font-weight:bold; }
        .session-card .session-desc { font-size:0.8rem;color:#87b9ff;margin-top:4px; }

        .session-join-form { display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:16px; }
        .session-join-form select, .session-join-form input { padding:8px 16px;border-radius:40px;border:1px solid #475569;background:#0f172a;color:#e2e8f0; }

        /* ===== Board ===== */
        .board-card { background:#1e293b; border-radius:20px; padding:24px; margin:16px 0; border-left:4px solid #3b82f6; }
        .board-card h2 { color:#3b82f6; margin-bottom:12px; }
        .board-card.warning { border-left-color:#ef4444; }
        .board-card.info { border-left-color:#8b5cf6; }

        /* ===== Pages ===== */
        .pages-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:20px; }
        .page-card { background:#1e293b;border-radius:20px;padding:20px;text-align:center;cursor:pointer;transition:.2s;color:#e2e8f0; }
        .page-card:hover { transform:translateY(-3px);background:#2d3e5f; }

        .clickable-link { cursor:pointer; color:#3b82f6; text-decoration:underline; }

        /* ===== Homepage ===== */
        .homepage-container { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:40px 20px; }
        .homepage-title { font-size:3rem;font-weight:bold;background:linear-gradient(135deg,#3b82f6,#8b5cf6);background-clip:text;-webkit-background-clip:text;color:transparent; }
        .homepage-subtitle { font-size:1.1rem; color:#87b9ff; margin-top:4px; font-weight:400; letter-spacing:2px; }
        .search-box { display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap; }
        .search-input { width:400px;max-width:70vw;padding:12px 20px;border-radius:60px;border:1px solid #475569;background:#0f172a;color:#e2e8f0; }

    <script>
    (function(){
        'use strict';

        // ============================================================
        // ===== 1. OAuth 配置 =====
        // ============================================================
        const OAUTH_CONFIG = {
            github: {
                clientId: 'Iv23liAm6gPWZ1SWjh5z',
                scope: 'read:user user:email',
            },
            backend: {
                primary: 'https://surfer2-oauth-main.workers.dev',
                fallback: 'https://surfer2-oauth-backup.vercel.app',
            },
            rateLimit: {
                maxRequestsPerMinute: 30,
                maxLoginAttemptsPerHour: 5,
            }
        };

        // ============================================================
        // ===== 2. 限流器 =====
        // ============================================================
        class RateLimiter {
            constructor() {
                this.requests = new Map();
                this.loginAttempts = new Map();
            }

            canRequest(userId) {
                const now = Date.now();
                const windowMs = 60 * 1000;
                if (!this.requests.has(userId)) {
                    this.requests.set(userId, [now]);
                    return { allowed: true };
                }
                const timestamps = this.requests.get(userId);
                const recent = timestamps.filter(t => now - t < windowMs);
                if (recent.length >= OAUTH_CONFIG.rateLimit.maxRequestsPerMinute) {
                    return {
                        allowed: false,
                        retryAfter: Math.ceil((recent[0] + windowMs - now) / 1000)
                    };
                }
                recent.push(now);
                this.requests.set(userId, recent);
                return { allowed: true };
            }

            recordLoginAttempt(userId) {
                const now = Date.now();
                const hourMs = 60 * 60 * 1000;
                if (!this.loginAttempts.has(userId)) {
                    this.loginAttempts.set(userId, { attempts: 1, firstAttempt: now });
                    return { allowed: true, remaining: OAUTH_CONFIG.rateLimit.maxLoginAttemptsPerHour - 1 };
                }
                const record = this.loginAttempts.get(userId);
                if (now - record.firstAttempt > hourMs) {
                    record.attempts = 1;
                    record.firstAttempt = now;
                    this.loginAttempts.set(userId, record);
                    return { allowed: true, remaining: OAUTH_CONFIG.rateLimit.maxLoginAttemptsPerHour - 1 };
                }
                if (record.attempts >= OAUTH_CONFIG.rateLimit.maxLoginAttemptsPerHour) {
                    return {
                        allowed: false,
                        cooldown: Math.ceil((record.firstAttempt + hourMs - now) / 1000)
                    };
                }
                record.attempts++;
                this.loginAttempts.set(userId, record);
                return { allowed: true, remaining: OAUTH_CONFIG.rateLimit.maxLoginAttemptsPerHour - record.attempts };
            }
        }

        // ============================================================
        // ===== 3. PostMessage 安全通信 =====
        // ============================================================
        class SecureMessenger {
            constructor() {
                this.allowedOrigins = [
                    'https://surfer2-oauth-main.workers.dev',
                    'https://surfer2-oauth-backup.vercel.app',
                    'https://github.com',
                    window.location.origin,
                ];
                this.messageHandlers = new Map();
                this._setupListener();
            }

            _setupListener() {
                window.addEventListener('message', (event) => {
                    if (!this.allowedOrigins.includes(event.origin)) {
                        console.warn('PostMessage: 拒绝来自未授权来源的消息:', event.origin);
                        return;
                    }
                    if (!event.data || typeof event.data !== 'object') {
                        console.warn('PostMessage: 无效的消息格式');
                        return;
                    }
                    const { type, payload } = event.data;
                    if (!type || !payload) {
                        console.warn('PostMessage: 缺少必要字段');
                        return;
                    }
                    const handler = this.messageHandlers.get(type);
                    if (handler) {
                        handler(payload, event);
                    }
                });
            }

            on(type, handler) {
                this.messageHandlers.set(type, handler);
            }

            send(targetWindow, type, payload) {
                const targetOrigin = targetWindow.location?.origin || '*';
                if (targetOrigin === 'null' || targetOrigin === 'about:blank') {
                    console.warn('PostMessage: 目标窗口 origin 无效');
                    return false;
                }
                targetWindow.postMessage({
                    type,
                    payload,
                    timestamp: Date.now(),
                }, targetOrigin);
                return true;
            }
        }

        // ============================================================
        // ===== 4. 主 OAuth 管理器 =====
        // ============================================================
        class Surfer2OAuth {
            constructor() {
                this.rateLimiter = new RateLimiter();
                this.messenger = new SecureMessenger();
                this.currentUser = null;
                this._restoreSession();
                this._setupMessageHandlers();
                this._bindUI();
            }

            _restoreSession() {
                try {
                    const saved = localStorage.getItem('surfer2_github_user');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.expiresAt && data.expiresAt > Date.now()) {
                            this.currentUser = data;
                            this._updateUI(data);
                            return;
                        }
                        localStorage.removeItem('surfer2_github_user');
                    }
                } catch (e) {
                    localStorage.removeItem('surfer2_github_user');
                }
                this.currentUser = null;
                this._updateUI(null);
            }

            _setupMessageHandlers() {
                this.messenger.on('oauth_success', (payload) => {
                    if (payload.userData && !payload.userData.error) {
                        this._handleUserData(payload.userData);
                    }
                });
                this.messenger.on('oauth_error', (payload) => {
                    console.error('OAuth 错误:', payload.error);
                    alert('登录失败: ' + (payload.error || '未知错误'));
                });
                this.messenger.on('logout', () => {
                    this.logout();
                });
            }

            _handleUserData(userData) {
                userData.expiresAt = Date.now() + 7 * 24 * 60 * 60 * 1000;
                this.currentUser = userData;
                localStorage.setItem('surfer2_github_user', JSON.stringify(userData));
                this._updateUI(userData);
                console.log('✅ GitHub OAuth 登录成功:', userData.login);
                if (typeof updateUserMenu === 'function') updateUserMenu();
                return userData;
            }

            _updateUI(userData) {
                const avatar = document.getElementById('userAvatar');
                const nameText = document.getElementById('userNameText');
                const userBtn = document.getElementById('userBtn');
                const menuAvatar = document.getElementById('userMenuAvatar');
                const menuName = document.getElementById('userMenuName');
                const menuLogin = document.getElementById('userMenuLogin');

                if (!userData) {
                    if (avatar) { avatar.style.display = 'none'; avatar.src = ''; }
                    if (nameText) nameText.textContent = '登录';
                    if (userBtn) { userBtn.classList.remove('logged-in'); }
                    if (menuAvatar) menuAvatar.src = '';
                    if (menuName) menuName.textContent = '未登录';
                    if (menuLogin) menuLogin.textContent = '请登录';
                    return;
                }

                if (avatar) {
                    avatar.src = userData.avatar_url || '';
                    avatar.style.display = userData.avatar_url ? 'inline-block' : 'none';
                }
                if (nameText) nameText.textContent = userData.login || '用户';
                if (userBtn) userBtn.classList.add('logged-in');
                if (menuAvatar) menuAvatar.src = userData.avatar_url || '';
                if (menuName) menuName.textContent = userData.name || userData.login || '用户';
                if (menuLogin) menuLogin.textContent = '@' + (userData.login || '');
            }

            _bindUI() {
                document.getElementById('userBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.currentUser) {
                        document.getElementById('userMenu').classList.toggle('show');
                    } else {
                        this.login();
                    }
                });

                document.getElementById('menuLogout').addEventListener('click', () => {
                    this.logout();
                });
                document.getElementById('menuLogout2').addEventListener('click', () => {
                    this.logout();
                    closeDropdown();
                });

                document.getElementById('menuProfile').addEventListener('click', () => {
                    if (this.currentUser) {
                        window.open('https://github.com/' + this.currentUser.login, '_blank');
                    }
                    document.getElementById('userMenu').classList.remove('show');
                });

                document.getElementById('menuGitHub').addEventListener('click', () => {
                    window.open('https://github.com', '_blank');
                    document.getElementById('userMenu').classList.remove('show');
                });

                document.addEventListener('click', (e) => {
                    const menu = document.getElementById('userMenu');
                    const btn = document.getElementById('userBtn');
                    if (!menu.contains(e.target) && !btn.contains(e.target)) {
                        menu.classList.remove('show');
                    }
                });

                document.getElementById('menuUser').addEventListener('click', () => {
                    closeDropdown();
                    if (this.currentUser) {
                        document.getElementById('userMenu').classList.toggle('show');
                    } else {
                        this.login();
                    }
                });
            }

            async _getAvailableBackend() {
                try {
                    const res = await fetch(`${OAUTH_CONFIG.backend.primary}/health`, {
                        signal: AbortSignal.timeout(3000),
                    });
                    if (res.ok) return OAUTH_CONFIG.backend.primary;
                } catch (e) {
                    console.warn('主服务不可用，尝试备用服务');
                }
                try {
                    const res = await fetch(`${OAUTH_CONFIG.backend.fallback}/health`, {
                        signal: AbortSignal.timeout(3000),
                    });
                    if (res.ok) return OAUTH_CONFIG.backend.fallback;
                } catch (e) {
                    console.warn('备用服务不可用');
                }
                return null;
            }

            _getDeviceId() {
                let id = localStorage.getItem('surfer2_device_id');
                if (!id) {
                    id = 'device_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
                    localStorage.setItem('surfer2_device_id', id);
                }
                return id;
            }

            async login() {
                const deviceId = this._getDeviceId();
                const canLogin = this.rateLimiter.recordLoginAttempt(deviceId);
                if (!canLogin.allowed) {
                    alert('登录尝试过于频繁，请等待 ' + canLogin.cooldown + ' 秒后再试');
                    return;
                }

                const backend = await this._getAvailableBackend();
                if (!backend) {
                    alert('OAuth 服务暂时不可用，请稍后重试');
                    return;
                }

                const authUrl =
                    `https://github.com/login/oauth/authorize?client_id=${OAUTH_CONFIG.github.clientId}&redirect_uri=${backend}/callback&scope=${OAUTH_CONFIG.github.scope}`;
                window.location.href = authUrl;
            }

            logout() {
                this.currentUser = null;
                localStorage.removeItem('surfer2_github_user');
                this._updateUI(null);
                document.getElementById('userMenu').classList.remove('show');

        async function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                alert('GitHub 授权失败: ' + error);
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            if (!code) return;

            try {
                const backend = await oauth._getAvailableBackend();
                if (!backend) {
                    alert('OAuth 服务暂时不可用，请稍后重试');
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return;
                }

                const res = await fetch(`${backend}/callback?code=${code}`, {
                    headers: { 'Content-Type': 'application/json' },
                });
                const userData = await res.json();

                if (userData.error) {
                    alert('登录失败: ' + userData.error);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return;
                }

                if (window.opener) {
                    const messenger = new SecureMessenger();
                    messenger.send(window.opener, 'oauth_success', { userData });
                }

                oauth._handleUserData(userData);
                statusSpan.innerText = '✅ 登录成功: ' + userData.login;
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (e) {
                console.error('OAuth 回调处理失败:', e);
                alert('登录处理失败，请重试');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function isPermanentTrusted(u){ if(!u)return false; for(let p of permanentTrust){ if(u.indexOf(p)!==-1)return true;} return false; }
        function isExemptUrl(u){ if(!u)return false; const ep=['lkjy-coding.github.io','Surfer2','Surfer2ButTestVersions','JCom','Surfer']; for(let p of ep){ if(u.indexOf(p)!==-1)return true;} return false; }
        function checkDefense(url){
            if(defenseMode==='none') return {blocked:false, reason:''};
            if(isPermanentTrusted(url)) return {blocked:false, reason:''};
            if(!url) return {blocked:false, reason:''};
            const lu=url.toLowerCase();
            if(defenseMode==='extra'){
                if(url.startsWith('surfer:')) return {blocked:false};
                if(lu.startsWith('https://')) return {blocked:false};
                if(lu.match(/\.(gov|mil|edu)(\/|$)/)) return {blocked:false};
                if(isExemptUrl(url)) return {blocked:false};
                if(lu.indexOf('.html')!==-1||lu.indexOf('.htm')!==-1) return {blocked:true, reason:'E强防御禁止 .html/.htm'};
                return {blocked:true, reason:'E强防御仅允许 HTTPS、内部、.gov/.mil/.edu'};
            }
            if(defenseMode==='high'){
                if(lu.startsWith('https://')) return {blocked:false};
                if(url.startsWith('surfer:')) return {blocked:false};
                if(lu.match(/\.(gov|mil|edu)(\/|$)/)) return {blocked:false};
                if(lu.startsWith('ftp://')||lu.indexOf('ftp.')!==-1) return {blocked:true, reason:'禁止FTP'};
                if(lu.indexOf('blog.')!==-1) return {blocked:true, reason:'禁止blog.'};
                if(lu.indexOf('.html')!==-1||lu.indexOf('.htm')!==-1) return {blocked:true, reason:'禁止.html/.htm'};
                if(lu.indexOf('.com.cn')!==-1||lu.indexOf('.cc')!==-1||lu.indexOf('ww3.')!==-1) return {blocked:true, reason:'禁止.com.cn/.cc/ww3.'};
                return {blocked:false};
            }
            if(defenseMode==='medium'){
                if(lu.startsWith('https://')) return {blocked:false};
                if(url.startsWith('surfer:')) return {blocked:false};
                if(lu.match(/\.(gov|mil|edu)(\/|$)/)) return {blocked:false};
                if(isExemptUrl(url)) return {blocked:false};
                if(lu.indexOf('.html')!==-1||lu.indexOf('.htm')!==-1) return {blocked:true, reason:'禁止.html/.htm'};
                if(lu.indexOf('.com.cn')!==-1||lu.indexOf('.cc')!==-1||lu.indexOf('ww3.')!==-1) return {blocked:true, reason:'禁止.com.cn/.cc/ww3.'};
                return {blocked:false};
            }
            if(defenseMode==='low'){
                if(lu.startsWith('https://')) return {blocked:false};
                if(url.startsWith('surfer:')) return {blocked:false};
                if(lu.match(/\.(gov|mil|edu)(\/|$)/)) return {blocked:false};
                if(lu.indexOf('.com.cn')!==-1||lu.indexOf('.cc')!==-1||lu.indexOf('ww3.')!==-1) return {blocked:true, reason:'禁止.com.cn/.cc/ww3.'};
                return {blocked:false};
            }
            return {blocked:false};
        }

        function showBlockedOverlay(url, reason){
            const existing=document.querySelector('.blocked-overlay'); if(existing)existing.remove();
            const ov=document.createElement('div'); ov.className='blocked-overlay';
            ov.innerHTML=`
                <span>🛡️ 已阻止访问</span>
                <span class="blocked-url">${escapeHtml(url)}</span>
                <span class="blocked-reason">📋 ${escapeHtml(reason)}</span>
                <div class="blocked-buttons">
                    <button class="blocked-trust-btn" id="blockedTrustOnce">✅ 一次性信任</button>
                    <button class="blocked-permanent-btn" id="blockedTrustPermanent">🔒 永久信任</button>
                    <button class="blocked-back-btn" id="blockedGoBack">◀ 返回</button>
                </div>
                <div class="blocked-search-box">
                    <input type="text" id="blockedSearchInput" placeholder="搜索...">
                    <button id="blockedSearchBtn">搜索</button>
                </div>
            `;
            document.body.appendChild(ov);
            document.getElementById('blockedTrustOnce').onclick=function(){ ov.remove(); loadUrlDirect(url); statusSpan.innerText='⏳ 一次性信任'; };
            document.getElementById('blockedTrustPermanent').onclick=function(){
                try{ const h=new URL(url).hostname; if(h&&!permanentTrust.includes(h)){ permanentTrust.push(h); localStorage.setItem('surfer2_permanent_trust',JSON.stringify(permanentTrust)); } }catch(e){ if(!permanentTrust.includes(url)){ permanentTrust.push(url); localStorage.setItem('surfer2_permanent_trust',JSON.stringify(permanentTrust)); } }
                ov.remove(); loadUrlDirect(url); statusSpan.innerText='🔒 永久信任';
            };
            document.getElementById('blockedGoBack').onclick=function(){ ov.remove(); const tab=tabs[activeTabIndex]; if(tab&&tab.historyIndex>0){ tab.historyIndex--; const pu=tab.history[tab.historyIndex]; urlInput.value=pu; navigateTo(pu,true); } else navigateTo('surfer:homepage',true); };
            document.getElementById('blockedSearchBtn').onclick=function(){ const q=document.getElementById('blockedSearchInput').value; if(q){ ov.remove(); const su='https://www.google.com/search?q='+encodeURIComponent(q); urlInput.value=su; navigateTo(su,true); } };
        }

        // ---- 导航核心 ----
        function loadUrlDirect(url){ frame.style.display='block'; internal.style.display='none'; frame.src=url; const tab=tabs[activeTabIndex]; if(tab){ tab.url=url; if(tab.history[tab.historyIndex]!==url){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(url); tab.historyIndex=tab.history.length-1; } updateTabTitle(url); } }

        function parseTransferUrl(url){
            if(!url) return null;
            const publicMatch = url.match(/^surfer:transfer\/public\/(.+)$/);
            const privateMatch = url.match(/^surfer:transfer\/private\/(.+)$/);
            if(publicMatch) return { type: 'public', id: publicMatch[1] };
            if(privateMatch) return { type: 'private', id: privateMatch[1] };
            if(url === 'surfer:transfer') return { type: 'index', id: null };
            return null;
        }

        function navigateTo(url, fromTabSwitch=false){
            let target=url.trim(); if(!target)return;
            const transferInfo = parseTransferUrl(target);
            if(transferInfo){
                if(transferInfo.type === 'index'){
                    renderInternalPage('transfer');
                    const tab=tabs[activeTabIndex];
                    if(tab){ tab.url=target; if(tab.history[tab.historyIndex]!==target){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(target); tab.historyIndex=tab.history.length-1; } updateTabTitle(target); }
                    urlInput.value=target;
                    return;
                } else {
                    currentSessionType = transferInfo.type;
                    currentSessionId = transferInfo.id;
                    renderInternalPage('transfer');
                    const tab=tabs[activeTabIndex];
                    if(tab){ tab.url=target; if(tab.history[tab.historyIndex]!==target){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(target); tab.historyIndex=tab.history.length-1; } updateTabTitle(target); }
                    urlInput.value=target;
                    statusSpan.innerText='会话: '+transferInfo.id;
                    return;
                }
            }
            const normalized=normalizeUrl(target);
            const dr=checkDefense(normalized);
            if(dr.blocked && !fromTabSwitch){ showBlockedOverlay(normalized, dr.reason); return; }
            target=normalized;
            if(target.startsWith('surfer:')){
                const page=target.slice(7).split('?')[0];
                const valid=['homepage','settings','note','chess','easyabroad','paintboard','pages','pin','report','translate','count','chajian','transfer','board','developer','dashboard','video'];
                if(valid.includes(page)){ renderInternalPage(page); const tab=tabs[activeTabIndex]; if(tab){ tab.url=target; if(tab.history[tab.historyIndex]!==target){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(target); tab.historyIndex=tab.history.length-1; } updateTabTitle(target); } urlInput.value=target; return; }
            }
            if(target==='about:blank'){ frame.style.display='block'; internal.style.display='none'; frame.src='about:blank'; const tab=tabs[activeTabIndex]; if(tab){ tab.url=target; if(tab.history[tab.historyIndex]!==target){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(target); tab.historyIndex=tab.history.length-1; } updateTabTitle(target); } urlInput.value=target; statusSpan.innerText='空白页'; return; }
            frame.style.display='block'; internal.style.display='none'; frame.src=target; const tab=tabs[activeTabIndex]; if(tab){ tab.url=target; if(tab.history[tab.historyIndex]!==target){ tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(target); tab.historyIndex=tab.history.length-1; } updateTabTitle(target); } urlInput.value=target;
        }

            else if(pageId==='count'){ internal.innerHTML=renderCountPage(); attachCountEvents(); }
            else if(pageId==='report'){ internal.innerHTML=renderReportPage(); attachReportEvents(); }
            else if(pageId==='chajian'){ internal.innerHTML=renderChajianPage(); attachChajianEvents(); }
            else if(pageId==='easyabroad'){ internal.innerHTML=renderExternalPage('https://lkjy-coding.github.io/EasyAbroad.html'); }
            else if(pageId==='paintboard'){ internal.innerHTML=renderExternalPage('https://lkjy-coding.github.io/PaintboardSurfer2.html'); }

            else if(pageId==='developer'){ internal.innerHTML=renderDeveloperPage(); attachDeveloperEvents(); }
            else if(pageId==='dashboard'){ internal.innerHTML=renderDashboardPage(); attachDashboardEvents(); }
            else if(pageId==='video'){ internal.innerHTML=renderVideoPage(); attachVideoEvents(); }
            else { internal.innerHTML='<div class="internal-page"><h2>未知域名</h2></div>'; }
            statusSpan.innerText=pageId; urlInput.value='surfer:'+pageId;
        }

        function renderChessPage(){

        function attachChessEvents(){
            const container=document.getElementById('chessBoard'); const st=document.getElementById('chessStatus');
            function checkWinner(b){ const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; for(let l of lines){ const [a,b,c]=l; if(b[a]&&b[a]===b[b]&&b[a]===b[c])return b[a]; } if(b.every(c=>c!==''))return 'tie'; return null; }
            function updateBoard(){
                container.innerHTML='';
                for(let i=0;i<9;i++){ const cell=document.createElement('div'); cell.className='game-cell'; cell.innerText=chessBoard[i]; if(chessActive&&chessBoard[i]===''&&chessTurn==='X'&&!chessWinner){ cell.onclick=(function(idx){ return function(){ playerMove(idx); }; })(i); } container.appendChild(cell); }
            }
            function endGame(w){ chessActive=false; chessWinner=w; st.innerText=w==='X'?'你赢了':w==='O'?'AI赢了':'平局'; updateBoard(); }
            function aiMove(){ if(!chessActive||chessTurn!=='O'||chessWinner)return; const empty=[]; for(let i=0;i<9;i++)if(chessBoard[i]==='')empty.push(i); if(!empty.length)return; const move=empty[Math.floor(Math.random()*empty.length)]; chessBoard[move]='O'; const w=checkWinner(chessBoard); if(w){endGame(w);return;} chessTurn='X'; updateBoard(); }
            function playerMove(i){ if(!chessActive||chessTurn!=='X'||chessBoard[i]!==''||chessWinner)return; chessBoard[i]='X'; const w=checkWinner(chessBoard); if(w){endGame(w);return;} chessTurn='O'; updateBoard(); setTimeout(aiMove,100); }
            document.getElementById('resetChessBtn').onclick=function(){ chessBoard=['','','','','','','','','']; chessActive=true; chessTurn='X'; chessWinner=null; st.innerText='你的回合'; updateBoard(); };
            updateBoard(); st.innerText='你的回合';
        }

        // ---- Translate ----
        function detectLanguage(text){
            if(/[\u4e00-\u9fa5]/.test(text)) return 'zh';
            if(/[a-zA-Z]/.test(text) && text.length > 0) return 'en';
            if(/[ぁ-んァ-ン]/.test(text)) return 'ja';
            return 'en';
        }
        function renderTranslatePage(){
            return `<div class="internal-page"><div class="translate-container"><h2>翻译</h2>

        function attachTranslateEvents(){

                let text=document.getElementById('transSrcText').value;

                if(src==='auto') src=detectLanguage(text);
                try {
                    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+src+'|'+tgt;
                    const res=await fetch(url); const data=await res.json();
                    document.getElementById('transResult').innerHTML=data.responseData?.translatedText||'翻译失败';

        function renderCountPage(){
            return `<div class="internal-page"><div class="calc-container">
                <div class="calc-gui">

                    <div class="calc-gui-row"><button class="calc-gui-btn clear" data-action="clear">AC</button><button class="calc-gui-btn" data-action="back">⌫</button><button class="calc-gui-btn operator" data-op="/">÷</button><button class="calc-gui-btn operator" data-op="*">×</button></div>
                    <div class="calc-gui-row"><button class="calc-gui-btn" data-num="7">7</button><button class="calc-gui-btn" data-num="8">8</button><button class="calc-gui-btn" data-num="9">9</button><button class="calc-gui-btn operator" data-op="-">−</button></div>
                    <div class="calc-gui-row"><button class="calc-gui-btn" data-num="4">4</button><button class="calc-gui-btn" data-num="5">5</button><button class="calc-gui-btn" data-num="6">6</button><button class="calc-gui-btn operator" data-op="+">+</button></div>
                    <div class="calc-gui-row"><button class="calc-gui-btn" data-num="1">1</button><button class="calc-gui-btn" data-num="2">2</button><button class="calc-gui-btn" data-num="3">3</button><button class="calc-gui-btn equals" data-action="equals">=</button></div>
                    <div class="calc-gui-row"><button class="calc-gui-btn" data-num="0">0</button><button class="calc-gui-btn" data-num=".">.</button><button class="calc-gui-btn func" data-func="sqrt">√</button><button class="calc-gui-btn func" data-func="pow">x²</button></div>
                    <div id="calcResultArea"></div>
                </div>
            </div></div>`;
        }
        function attachCountEvents(){
            let expr=''; const display=document.getElementById('calcDisplay');
            function update(){ display.innerText=expr||'0'; }
            function calc(){
                try{ let e=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**'); e=e.replace(/√\(?([^)]+)\)?/g,'Math.sqrt($1)').replace(/(\d+)²/g,'Math.pow($1,2)'); const res=eval(e); document.getElementById('calcResultArea').innerHTML='结果: '+res; expr=res.toString(); update(); }catch(e){ document.getElementById('calcResultArea').innerHTML='错误: '+e.message; }
            }
            function handle(v){ if(v==='clear'){expr='';document.getElementById('calcResultArea').innerHTML='';update();} else if(v==='back'){expr=expr.slice(0,-1);update();} else if(v==='equals'){calc();} else if(v==='sqrt'){expr+='√(';update();} else if(v==='pow'){expr+='²';update();} else {expr+=v;update();} }
            document.querySelectorAll('.calc-gui-btn[data-num]').forEach(b=>b.onclick=()=>handle(b.dataset.num));
            document.querySelectorAll('.calc-gui-btn[data-op]').forEach(b=>b.onclick=()=>handle(b.dataset.op));
            document.querySelector('[data-action="clear"]').onclick=()=>handle('clear');
            document.querySelector('[data-action="back"]').onclick=()=>handle('back');
            document.querySelector('[data-action="equals"]').onclick=()=>handle('equals');
            document.querySelectorAll('.calc-gui-btn[data-func]').forEach(b=>b.onclick=()=>handle(b.dataset.func));
        }

            const clearBtn = document.getElementById('clearDevLogBtn');
            const refreshBtn = document.getElementById('refreshDevLogBtn');
            const closeBtn = document.getElementById('closeDevBtn');
            const downloadBtn = document.getElementById('downloadCrashLogBtn');
            if(clearBtn) clearBtn.onclick = function(){
                logEntries.length = 0;
                updateDevLogSafe();
                statusSpan.innerText = '日志已清空';
            };
            if(refreshBtn) refreshBtn.onclick = function(){
                updateDevLogSafe();
                statusSpan.innerText = '已刷新';
            };
            if(closeBtn) closeBtn.onclick = function(){
                navigateTo('surfer:homepage');
            };
            if(downloadBtn) downloadBtn.onclick = function(){
                downloadCrashLog();
            };
            setTimeout(updateDevLogSafe, 100);
        }

        // ---- Dashboard ----
        function renderDashboardPage(){
            const user = oauth.getUser();
            const userStatus = user ? user.login : '未登录';
            return `<div class="internal-page">
                <h2>📊 控制面板</h2>
                <p style="color:#87b9ff;margin-bottom:16px;">当前用户: ${userStatus}</p>
                <div class="dashboard-grid">
                    <div class="dashboard-card" data-action="settings"><div class="card-icon">⚙️</div><div class="card-title">设置</div><div class="card-desc">快捷键: B</div></div>
                    <div class="dashboard-card" data-action="pin"><div class="card-icon">📌</div><div class="card-title">快捷方式</div><div class="card-desc">快捷键: P</div></div>
                    <div class="dashboard-card" data-action="user" data-toggle="user-menu"><div class="card-icon">👤</div><div class="card-title">用户管理</div><div class="card-desc">快捷键: U</div></div>
                    <div class="dashboard-card" data-action="hide"><div class="card-icon">🙈</div><div class="card-title">隐藏窗口</div><div class="card-desc">一键隐藏</div></div>
                    <div class="dashboard-card" data-action="logout"><div class="card-icon">🚪</div><div class="card-title">登出</div><div class="card-desc">退出当前账号</div></div>
                    <div class="dashboard-card" data-action="developer"><div class="card-icon">🛠️</div><div class="card-title">开发者工具</div><div class="card-desc">实时日志</div></div>
                    <div class="dashboard-card" data-action="video"><div class="card-icon">🎬</div><div class="card-title">视频播放器</div><div class="card-desc">本地视频</div></div>
                    <div class="dashboard-card" data-action="homepage"><div class="card-icon">🏠</div><div class="card-title">首页</div><div class="card-desc">返回主页</div></div>
                    <div class="dashboard-card" data-action="board"><div class="card-icon">📢</div><div class="card-title">公告板</div><div class="card-desc">官方公告</div></div>
                </div>
            </div>`;
        }
        function attachDashboardEvents(){
            document.querySelectorAll('.dashboard-card').forEach(card => {
                card.onclick = function() {
                    const action = this.dataset.action;
                    switch(action) {
                        case 'settings': navigateTo('surfer:settings'); break;
                        case 'pin': if(!oauth.isLoggedIn()) { alert('请先登录'); oauth.login(); } else navigateTo('surfer:pin'); break;
                        case 'user': toggleUserMenu(); break;
                        case 'hide':
                            const c = document.querySelector('.surfer-container');
                            if(!isWindowHidden) {
                                c.style.opacity = '0';
                                c.style.visibility = 'hidden';
                                isWindowHidden = true;
                                const rb = document.createElement('button');
                                rb.innerText = '显示窗口';
                                rb.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:10000;background:#3b82f6;border:none;padding:8px 16px;border-radius:40px;color:#fff;cursor:pointer';
                                rb.onclick = function() {
                                    c.style.opacity = '1';
                                    c.style.visibility = 'visible';
                                    isWindowHidden = false;
                                    rb.remove();
                                };
                                document.body.appendChild(rb);
                            }
                            break;
                        case 'logout': oauth.logout(); break;
                        case 'developer': navigateTo('surfer:developer'); break;
                        case 'video': navigateTo('surfer:video'); break;
                        case 'homepage': navigateTo('surfer:homepage'); break;
                        case 'board': navigateTo('surfer:board'); break;
                        default: break;
                    }
                };
            });
        }

        // ---- Video ----
        function renderVideoPage(){
            return `<div class="internal-page">
                <div class="video-container">
                    <h2>🎬 本地视频播放器</h2>
                    <p style="color:#87b9ff;margin-bottom:16px;">选择本地视频文件播放，不上传任何数据</p>
                    <div class="video-upload-area" id="videoUploadArea">
                        <span class="upload-icon">📁</span>
                        <div class="upload-text">点击或拖拽上传视频文件</div>
                        <div class="upload-hint">支持 MP4, WebM, AVI, MOV, MKV 等格式</div>
                        <input type="file" id="videoFileInput" accept="video/*" style="display:none;">
                    </div>
                    <div id="videoPlayerWrapper" class="video-player-wrapper" style="display:none;">
                        <video id="videoPlayer" controls></video>
                        <div class="video-controls">
                            <span class="video-info" id="videoInfo">未加载</span>
                            <button class="video-close-btn" id="videoCloseBtn">✕ 关闭</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }
        function attachVideoEvents(){
            const uploadArea = document.getElementById('videoUploadArea');
            const fileInput = document.getElementById('videoFileInput');
            const playerWrapper = document.getElementById('videoPlayerWrapper');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoInfo = document.getElementById('videoInfo');
            const closeBtn = document.getElementById('videoCloseBtn');

            function loadVideo(file) {
                if (!file || !file.type.startsWith('video/')) {
                    alert('请选择一个有效的视频文件');
                    return;
                }
                const url = URL.createObjectURL(file);
                videoPlayer.src = url;
                videoPlayer.load();
                playerWrapper.style.display = 'block';
                videoInfo.textContent = '📹 ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)';
                statusSpan.innerText = '🎬 已加载: ' + file.name;
            }

            uploadArea.onclick = function() { fileInput.click(); };
            fileInput.onchange = function(e) {
                if (this.files && this.files[0]) {
                    loadVideo(this.files[0]);
                }
                this.value = '';
            };
            uploadArea.ondragover = function(e) { e.preventDefault(); this.classList.add('dragover'); };
            uploadArea.ondragleave = function(e) { e.preventDefault(); this.classList.remove('dragover'); };
            uploadArea.ondrop = function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files[0] && files[0].type.startsWith('video/')) {
                    loadVideo(files[0]);
                } else {
                    alert('请拖拽视频文件');
                }
            };
            closeBtn.onclick = function() {
                videoPlayer.pause();
                videoPlayer.src = '';
                playerWrapper.style.display = 'none';
                videoInfo.textContent = '已关闭';
                statusSpan.innerText = '视频已关闭';
                URL.revokeObjectURL(videoPlayer.src);
            };
        }

        // ---- 键盘 ----
        const keyboard = document.getElementById('onscreenKeyboard');
        document.getElementById('closeKeyboardBtn').onclick=function(){ keyboard.classList.remove('show'); enableOnscreenKeyboard=false; localStorage.setItem('surfer2_onscreenKeyboard','false'); };
        document.querySelectorAll('.key-btn[data-key]').forEach(btn=>{
            btn.onclick=function(){
                const key=this.dataset.key;
                const active = document.activeElement;
                if(active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
                    const start = active.selectionStart;
                    const end = active.selectionEnd;
                    const val = active.value;
                    if(key === 'Backspace'){
                        active.value = val.slice(0, start-1) + val.slice(end);
                        active.selectionStart = active.selectionEnd = start-1;
                    } else if(key === 'Enter'){
                        active.value = val.slice(0, start) + '\n' + val.slice(end);
                        active.selectionStart = active.selectionEnd = start+1;
                    } else {
                        active.value = val.slice(0, start) + key + val.slice(end);
                        active.selectionStart = active.selectionEnd = start+1;
                    }
                    active.focus();
                }
            };
        });

        // ---- 快捷键 ----
        document.addEventListener('keydown',function(e){
            if(isInputFocused())return;
            if((e.key==='b'||e.key==='B')&&enableBKey){ e.preventDefault(); navigateTo('surfer:settings'); }
            if((e.key==='p'||e.key==='P')&&enablePKey){ e.preventDefault(); if(!oauth.isLoggedIn()){ alert('请先登录'); oauth.login(); } else navigateTo('surfer:pin'); }
            if((e.key==='u'||e.key==='U')&&enableUKey){ e.preventDefault(); toggleUserMenu(); }
        });

        function isInputFocused(){ const a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'); }

        // ---- 三杠菜单 ----
        function toggleDropdown(){ dropdown.classList.toggle('show'); }
        function closeDropdown(){ dropdown.classList.remove('show'); }

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            toggleDropdown();
        });

        document.addEventListener('click', function(e) {
            if (!dropdown.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
                closeDropdown();
            }
        });

        dropdown.addEventListener('click', function(e) {
            e.stopPropagation();
        });

        document.getElementById('menuSettings').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown(); navigateTo('surfer:settings');
        });
        document.getElementById('menuPin').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown();
            if(!oauth.isLoggedIn()){ alert('请先登录'); oauth.login(); } else navigateTo('surfer:pin');
        });
        document.getElementById('menuUser').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown();
            if(oauth.isLoggedIn()) {
                document.getElementById('userMenu').classList.toggle('show');
            } else {
                oauth.login();
            }
        });
        document.getElementById('menuHide').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown();
            const c = document.querySelector('.surfer-container');
            if(!isWindowHidden) {
                c.style.opacity = '0';
                c.style.visibility = 'hidden';
                isWindowHidden = true;
                const rb = document.createElement('button');
                rb.innerText = '显示窗口';
                rb.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:10000;background:#3b82f6;border:none;padding:8px 16px;border-radius:40px;color:#fff;cursor:pointer';
                rb.onclick = function() {
                    c.style.opacity = '1';
                    c.style.visibility = 'visible';
                    isWindowHidden = false;
                    rb.remove();
                };
                document.body.appendChild(rb);
            }
        });
        document.getElementById('menuLogout2').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown(); oauth.logout();
        });
        document.getElementById('menuDeveloper').addEventListener('click', function(e) {
            e.stopPropagation(); closeDropdown(); navigateTo('surfer:developer');
        });

        // ---- 用户菜单 toggle ----
        function toggleUserMenu() {
            if(oauth.isLoggedIn()) {
                document.getElementById('userMenu').classList.toggle('show');
            } else {
                oauth.login();
            }
        }

        // ---- 导航按钮 ----
        function goBack(){ const tab=tabs[activeTabIndex]; if(tab&&tab.historyIndex>0){ tab.historyIndex--; const pu=tab.history[tab.historyIndex]; urlInput.value=pu; navigateTo(pu,true); } else statusSpan.innerText='没有更早历史'; }
        function goForward(){ const tab=tabs[activeTabIndex]; if(tab&&tab.historyIndex<tab.history.length-1){ tab.historyIndex++; const nu=tab.history[tab.historyIndex]; urlInput.value=nu; navigateTo(nu,true); } else statusSpan.innerText='没有更新历史'; }

        backBtn.onclick=goBack; forwardBtn.onclick=goForward;
        reloadBtn.onclick = function(e) { e.preventDefault(); showRefreshDialog(); };
        goBtn.onclick=function(){ const u=urlInput.value; const tab=tabs[activeTabIndex]; if(tab){ tab.url=u; tab.history=tab.history.slice(0,tab.historyIndex+1); tab.history.push(u); tab.historyIndex=tab.history.length-1; saveTabs(); } navigateTo(u); };
        urlInput.onkeypress=function(e){ if(e.key==='Enter')goBtn.click(); };
        addTabBtn.onclick=addTab;

        // ---- 恢复个性化设置 ----
        function restoreSettings() {
            const lightMode = localStorage.getItem('surfer2_lightMode') === 'true';
            const acrylic = localStorage.getItem('surfer2_acrylic') === 'true';
            const highContrast = localStorage.getItem('surfer2_highContrast') === 'true';
            if (lightMode) document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
            if (acrylic) document.body.classList.add('acrylic-active');
            else document.body.classList.remove('acrylic-active');
            if (highContrast) document.body.classList.add('high-contrast');
            else document.body.classList.remove('high-contrast');
            const bg = localStorage.getItem('surfer2_bgImage');
            if (bg) {
                document.getElementById('bgLayer').style.backgroundImage = 'url(' + bg + ')';
                document.getElementById('bgLayer').style.backgroundSize = 'cover';
                document.getElementById('bgLayer').style.backgroundPosition = 'center';
            }
        }

        // ---- 初始化 ----
        loadCrashSentences().then(() => { console.log('崩溃句子已准备就绪'); });

        loadTabs();
        if(tabs.length>0&&tabs[activeTabIndex]){ const it=tabs[activeTabIndex]; urlInput.value=it.url||'surfer:homepage'; switchTab(activeTabIndex); }
        restoreSettings();

        setTimeout(function(){ window.dispatchEvent(new Event('resize')); },100);

        const observer = new MutationObserver(() => {
            if (document.getElementById('devLogContainer')) { attachDeveloperEvents(); }
            if (document.querySelector('.dashboard-card')) { attachDashboardEvents(); }
            if (document.getElementById('videoUploadArea')) { attachVideoEvents(); }
        });
        observer.observe(internal, { childList: true, subtree: true });

        console.log('Surfer2 7.00.00 启动 — 安全加固 · GitHub OAuth 已集成');
    })();
    </script>
</body>
</html>
